<style>
:root{
  --navy:#13294b;--navy2:#1d3c6b;--amber:#f2a51a;--amber-d:#b97a00;
  --bg:#eef1f7;--card:#ffffff;--ink:#0f1b33;--mute:#5a6783;--line:#d9dfec;
  --ok:#14805a;--okbg:#e2f5ec;--bad:#c93a45;--badbg:#fbe6e8;--tick:#ccd3e2;
  --conf:#13294b;
  --shadow:0 1px 2px rgba(19,41,75,.08);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1322;--card:#13213a;--ink:#e7ecf7;--mute:#9aa8c4;--line:#243659;
  --ok:#4fd1a0;--okbg:#0f3a2e;--bad:#ff7d87;--badbg:#431c22;--tick:#2a3b5f;--conf:#8fb4ff;--amber-d:#f2a51a;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;touch-action:manipulation}
#statusbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
#view{max-width:560px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));min-height:100vh}
.hdr{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 22px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hdr h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hdr p{margin:6px 0 0;color:#b9c7e3;font-size:15px}
.hdr .row{display:flex;align-items:center;gap:12px}
.hdr .grow{flex:1;min-width:0}
.pad{padding:16px 16px 0}
h2{font-size:18px;margin:22px 4px 10px;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;border:0;border-radius:14px;
  font:inherit;font-weight:700;font-size:17px;background:var(--navy);color:#fff;cursor:pointer}
.btn.amber{background:var(--amber);color:#1b1402}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:44px;font-size:15px;padding:8px 14px;width:auto}
.btn[disabled]{opacity:.45}
.btn:active{transform:scale(.99)}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.stack>*+*{margin-top:10px}
.muted{color:var(--mute)}
.small{font-size:14px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.tag.amber{background:#fff3d6;color:#7a5200;border-color:#f2d58a}
@media (prefers-color-scheme:dark){.tag.amber{background:#3b2d08;color:#f2c766;border-color:#5b4510}}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs.hide{display:none}
#tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:11.5px;font-weight:600;padding:9px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;cursor:pointer}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--navy)}
@media (prefers-color-scheme:dark){#tabs button.on{color:var(--amber)}}
#tabs button.on svg{stroke-width:2.4}
/* ring */
.ring{display:block;margin:2px auto 0;width:100%;max-width:300px;height:auto}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12.5px;color:var(--mute)}
/* bars */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--navy)}
@media (prefers-color-scheme:dark){.bar .m{background:#8fb4ff}}
.bar .s{background:var(--amber)}
/* rows */
.row-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;color:var(--ink);min-height:60px;cursor:pointer}
.row-item .grow{flex:1;min-width:0}
.row-item b{display:block;font-size:16px;line-height:1.25}
.row-item .small{display:block}
.badge{flex:none;min-width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;padding:0 6px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--navy);color:#fff}
.qtop .btn{width:auto;min-height:40px;padding:6px 14px;font-size:15px;background:rgba(255,255,255,.14);color:#fff}
.qtop .grow{flex:1;text-align:center;font-weight:700}
.prog{height:5px;background:rgba(255,255,255,.18)}
.prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
.qtext{font-size:20px;line-height:1.35;font-weight:600;margin:10px 2px 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16.5px;color:var(--ink);
  background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-height:56px;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.opt.sel{border-color:var(--amber);background:rgba(242,165,26,.12)}
.opt.sel .l{background:var(--amber);border-color:var(--amber);color:#1b1402}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.expl{border-radius:14px;padding:14px;margin:4px 0 14px;font-size:15.5px}
.expl.ok{background:var(--okbg);border:1px solid var(--ok)}
.expl.no{background:var(--badbg);border:1px solid var(--bad)}
.expl b.v{display:block;margin-bottom:4px;font-size:16px}
.dock{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px))}
/* flashcard */
.fc{perspective:1200px;margin:6px 0 16px}
.fc .face{min-height:300px;border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;
  border:1px solid var(--line);white-space:pre-line}
.fc .front{background:var(--card);font-size:22px;font-weight:700;line-height:1.3}
.fc .back{background:var(--navy);color:#fff;font-size:18px;line-height:1.5;font-weight:500;border-color:var(--navy)}
.fc .hint{margin-top:16px;font-size:13px;font-weight:600;color:var(--mute)}
.fc .back .hint{color:#b9c7e3}
.note{background:#fff3d6;color:#5d4100;border-radius:12px;padding:10px 12px;font-size:14.5px;margin:8px 0}
@media (prefers-color-scheme:dark){.note{background:#3b2d08;color:#f2d58a}}
/* coverage */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{background:var(--amber);border-color:var(--amber);color:#1b1402}}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--tick)}
.dot.conf{background:var(--ok);border-color:var(--ok)}
.dot.rev{background:var(--amber);border-color:var(--amber)}
.ctitle{display:flex;align-items:center;gap:10px;margin:20px 4px 8px;font-weight:700;font-size:16px}
.ctitle small{font-weight:500;color:var(--mute);margin-left:auto}
.qrow{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.qhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--ink);padding:12px 14px;min-height:58px;cursor:pointer}
.qhead .t{flex:1;min-width:0;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.qbody .full{font-size:15.5px;margin:12px 0;white-space:pre-line}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on.c{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.r{background:var(--amber);border-color:var(--amber);color:#1b1402}
.seg button.on.n{background:var(--mute);border-color:var(--mute);color:#fff}
textarea{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:84px;resize:vertical}
.tip{display:flex;gap:12px;align-items:flex-start;background:#fff3d6;color:#5d4100;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}
@media (prefers-color-scheme:dark){.tip{background:#3b2d08;color:#f2d58a}}
.tip button{flex:none;border:0;background:none;font:inherit;font-weight:700;color:inherit;padding:4px 6px;min-height:32px}
.big{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.02em}
.center{text-align:center}
.mt{margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ===== A. Intro to Biotechnology & Careers (1-6) ===== */
Q(1,"Which statement best defines biotechnology?","The use of living organisms, cells, or their molecules to make products or solve problems","The study of rocks, minerals, and how the Earth formed","The manufacture of synthetic plastics from petroleum","The surgical treatment of genetic disease","Biotechnology harnesses biology (microbes, cells, enzymes, DNA) for practical uses in medicine, food, agriculture, and industry.");
Q(1,"Brewing beer, making bread, and producing insulin in bacteria are all biotechnology because each one...","uses living organisms or their products to make something useful","requires a fully sterile operating room","depends on editing human chromosomes","relies on synthetic chemicals instead of cells","The common thread is using living things (yeast, bacteria) or their molecules for a human purpose.");
Q(2,"What do traditional and modern biotechnology have in common?","Both use living organisms or their products to make useful goods","Both directly cut and paste specific genes","Both were invented after DNA was sequenced","Both require recombinant plasmids","Similarity: both harness living things. The difference is how much control there is over the genes involved.");
Q(2,"Which is the key DIFFERENCE between modern and traditional biotechnology?","Modern biotech deliberately manipulates specific genes or DNA; traditional uses natural processes or breeding without direct gene manipulation","Traditional biotech uses living cells; modern biotech does not","Modern biotech only works on bacteria","Traditional biotech always involves a laboratory","Traditional: fermentation, selective breeding (genes unknown/not directly edited). Modern: genetic engineering, recombinant DNA, PCR, etc.");
Q(3,"Which is an example of TRADITIONAL biotechnology?","Making yogurt with bacterial cultures","Producing human insulin in E. coli","Making bacteria glow with the pGLO plasmid","Copying DNA with PCR","Yogurt, cheese, bread, beer, and wine use natural fermentation, which predates knowledge of DNA.");
Q(3,"Which is an example of MODERN biotechnology?","Making human insulin in genetically engineered bacteria","Baking bread with yeast","Selective breeding of dairy cattle","Fermenting grapes into wine","Inserting the human insulin gene into bacteria is genetic engineering, a modern technique.");
Q(3,"Selective breeding of crops over many generations is classified as...","traditional biotechnology","modern biotechnology because it edits DNA directly","not biotechnology because no lab is used","genetic engineering","Selective breeding changes organisms by choosing parents with desired traits. It is not direct gene manipulation, so it is traditional.");
Q(4,"What is genetic engineering?","Directly altering an organism's DNA, often by inserting a gene from another organism","Crossing two plants to get offspring with better traits","Fermenting sugars with yeast","Observing chromosomes under a microscope","Genetic engineering = deliberate, direct change to an organism's genome (e.g., adding the GFP gene to bacteria).");
Q(4,"Which activity is genetic engineering?","Transforming E. coli with pGLO so they make GFP","Making cheese with rennet","Growing bacteria on agar","Breeding two dogs for a desired coat color","Transformation with pGLO inserts a foreign gene (GFP) into a cell, which is genetic engineering.");
Q(5,"A person who tests each batch of a biotech product to confirm it meets purity standards works as a...","quality control (QC) analyst","bioinformatician","genetic counselor","bioprocess engineer","QC analysts run assays on products to make sure they meet specifications before release.");
Q(5,"A bioinformatician mainly...","uses computers and statistics to analyze biological data such as DNA sequences","runs large fermenters to produce protein drugs","advises families about inherited disease risk","tests the purity of each product batch","Bioinformatics = biology + computing, such as analyzing genomes and protein data.");
Q(6,"Which job generally requires the most advanced degree?","Principal investigator leading a research lab (PhD)","Laboratory technician (certificate or associate degree)","Manufacturing technician","Lab assistant","Independent research leadership typically requires a doctorate (PhD/MD). Technician roles generally start at certificate/associate level.");
Q(6,"Which degree-and-job pairing is the most typical?","Associate degree: laboratory or manufacturing technician","High school diploma: lead research scientist","Associate degree: director of R&D","Bachelor's degree: university professor","Technician roles fit certificates/associate degrees; bachelor's often leads to research associate or QC/QA; master's/PhD to senior scientist or lead roles.");
C(1,"What is biotechnology?","The use of living organisms, cells, or their molecules (DNA, proteins, enzymes) to make products or solve problems, in areas like medicine, food, agriculture, and industry.");
C(2,"Traditional vs modern biotechnology: similar and different?","SIMILAR: both use living things to make useful products.\nDIFFERENT: traditional = natural processes/breeding, genes not directly manipulated. Modern = directly manipulates DNA/genes (genetic engineering, recombinant DNA).");
C(3,"Examples: traditional vs modern biotech","TRADITIONAL: bread, beer, wine, yogurt, cheese, selective breeding.\nMODERN: genetically engineered insulin, pGLO/GFP bacteria, PCR, GMO crops, gene therapy.");
C(4,"What is genetic engineering?","Directly changing an organism's DNA, often by inserting a gene (from the same or another species) so the organism makes a new protein or trait.");
C(5,"Biotech career options","Research scientist, lab technician, QC/QA analyst, manufacturing/bioprocess technician, bioinformatician, genetic counselor, forensic scientist, regulatory affairs, biomedical engineer.");
C(6,"Biotech jobs by degree","Certificate/associate: lab or manufacturing technician.\nBachelor's: research associate, QC/QA analyst.\nMaster's: senior scientist, genetic counselor.\nPhD/MD: principal investigator, R&D director, professor.");

/* ===== B. Lab Safety, MSDS/PPE, Equipment (7-15) ===== */
Q(7,"What information does an SDS (formerly MSDS) provide?","Hazards, safe handling, storage, first aid, and spill/disposal information for a chemical","Only the price and supplier of a chemical","The recipe for making a chemical","The lab's attendance rules","An SDS is the chemical's safety reference: hazards, PPE, first aid, fire, spill, storage, and disposal.");
Q(7,"A classmate gets a chemical on their skin. Where do you look for first-aid instructions for that chemical?","Its SDS","Its expiration date","The micropipette manual","The balance calibration log","The SDS has a first-aid measures section for each chemical.");
Q(8,"Which PPE protects your eyes from a chemical splash?","Splash goggles","Nitrile gloves","Closed-toe shoes","A lab coat","Chemical splash goggles seal around the eyes. Glasses alone do not protect well.");
Q(8,"Which hazard/PPE pairing is correct?","Hot glassware: heat-resistant gloves","UV light: nitrile gloves only","Chemical splash: closed-toe shoes","Sharp broken glass: safety goggles only","Match PPE to the hazard: heat gloves for hot items, UV-blocking eyewear/face shield for UV, goggles for splashes, gloves for skin contact.");
Q(8,"Which of the following is NOT personal protective equipment?","A fume hood","Safety goggles","A lab coat","Nitrile gloves","A fume hood is an engineering control that removes vapors. PPE is worn by the person.");
Q(9,"Which information belongs on a lab solution label?","Name/contents, concentration, date prepared, preparer's initials (plus hazards)","Only the color of the solution","Only the teacher's name","Only the room number","Unlabeled or poorly labeled solutions are a safety hazard. Include what it is, how strong it is, when it was made, and by whom.");
Q(10,"A microcentrifuge is used to...","spin small tubes at high speed to pellet material or collect liquid at the bottom","measure microliter volumes of liquid","amplify DNA by cycling temperature","separate DNA by size using electricity","Microcentrifuges spin microtubes (about 1.5-2 mL) so dense material forms a pellet.");
Q(10,"Which tool is used to transfer volumes of about 0.5 to 1000 µL?","Micropipette","Serological pipette","Vortex","Spectrophotometer","Micropipettes handle microliter volumes. Serological pipettes handle larger volumes (mL).");
Q(10,"Which tool measures and transfers larger liquid volumes (roughly 1-25 mL) using a pipette aid?","Serological pipette","Micropipette","Picofuge","Thermal cycler","Serological pipettes are graduated, used with a pipette controller for mL-scale volumes.");
Q(10,"A spectrophotometer is used to...","measure how much light a sample absorbs or transmits (e.g., to find concentration)","spin tubes quickly","mix a tube by vibrating it","copy DNA","It passes light through a sample; absorbance relates to concentration (DNA, protein, bacterial culture).");
Q(10,"What does gel electrophoresis apparatus do?","Separates DNA, RNA, or proteins by size using an electric current through a gel","Heats and cools DNA for PCR","Spins cells into a pellet","Measures pH","Negatively charged DNA moves toward the positive electrode; smaller fragments travel farther through the gel.");
Q(10,"A vortex is used to...","mix liquids in a tube by rapid vibration","amplify DNA","measure absorbance","separate proteins by charge","A vortex swirls the tube contents to mix them quickly.");
Q(10,"A thermal cycler (PCR machine) is used to...","cycle temperatures so a DNA sequence is copied (amplified)","separate DNA by size","measure DNA concentration","spin liquids to the bottom of a tube","PCR repeats denaturing, annealing, and extending to exponentially copy target DNA.");
Q(11,"A picofuge differs from a microcentrifuge mainly because it is...","a small, quick-spin centrifuge that briefly brings liquid to the tube bottom","a device that cycles temperatures","a tool for measuring volumes","a balance for weighing","A picofuge is a compact, low-speed 'quick spin'. Microcentrifuges reach higher speeds for pelleting.");
Q(11,"Micropipette tips and microtubes are best described as...","disposable supplies used with micropipettes and for holding small samples","electronic instruments","measuring devices for pH","safety equipment","Tips attach to micropipettors (one new tip per sample). Microtubes hold small volumes of sample or reagent. Where they are stored in your lab is something to write in your own notes.");
Q(12,"When using a micropipette, how far do you press the plunger before inserting the tip into the liquid to draw up a sample?","To the first stop","To the second stop","Not at all","Halfway between stops","Press to the first stop, submerge the tip, release slowly to draw up the exact volume.");
Q(12,"To dispense liquid from a micropipette you should...","press to the first stop, then the second stop to expel the last drop, then eject the tip","release the plunger quickly into the tube","press only to the first stop","remove the tip by hand","The second stop pushes out the remaining liquid. Eject the tip into waste without touching it.");
Q(12,"Which is a correct micropipette practice?","Use a new tip for each sample and never set the volume outside the pipette's range","Reuse a tip to save supplies","Lay the pipette on its side with liquid in the tip","Dial past the maximum volume to be safe","Reusing tips contaminates samples. Keep the pipette upright with liquid in the tip; never exceed the range.");
Q(13,"On a P-10, a dial reading of 055 means...","5.5 µL","55 µL","550 µL","0.55 µL","P-10 reads XX.X µL, so 055 is 05.5 = 5.5 µL.");
Q(13,"On a P-100, a dial reading of 055 means...","55 µL","5.5 µL","550 µL","0.55 mL","P-100 reads whole microliters: 055 = 55 µL.");
Q(13,"On a P-1000, a dial reading of 055 means...","550 µL","55 µL","5.5 µL","55 mL","P-1000 digits read thousands/hundreds/tens of µL: 055 = 0.55 mL = 550 µL.");
Q(14,"A P-10 is set to 089. What volume will it pipette?","8.9 µL (0.0089 mL)","89 µL (0.089 mL)","890 µL (0.89 mL)","0.89 µL (0.00089 mL)","On a P-10 the last digit is tenths: 08.9 µL. Divide by 1000 to get mL: 0.0089 mL.");
Q(14,"A P-100 is set to 089. What volume will it pipette?","89 µL (0.089 mL)","8.9 µL (0.0089 mL)","890 µL (0.89 mL)","0.89 µL","P-100 reads whole µL: 89 µL. 89 µL / 1000 = 0.089 mL.");
Q(14,"A P-1000 is set to 089. What volume will it pipette?","890 µL (0.89 mL)","89 µL (0.089 mL)","8.9 µL (0.0089 mL)","8900 µL","On a P-1000 the digits are hundreds, tens, ones of 10 µL, so 089 = 890 µL = 0.89 mL.");
Q(15,"To balance a microcentrifuge correctly, you should...","place tubes directly opposite each other with equal volume/weight","put all tubes on one side","spin one tube alone","use different volumes in opposite tubes","An unbalanced rotor vibrates and can damage the machine or break tubes.");
Q(15,"You have an odd number of samples to spin. What do you do?","Add a balance tube with the same volume of water opposite the extra sample","Spin it alone","Overfill the tube","Skip the lid","A 'blank' balance tube filled to the same volume keeps the rotor balanced.");
C(7,"What is an MSDS/SDS?","Material Safety Data Sheet (now Safety Data Sheet). A document for each chemical listing hazards, safe handling and storage, PPE, first aid, spill and disposal procedures.");
C(8,"PPE: what it is + examples by hazard","Personal Protective Equipment, worn to protect you.\nChemical splash: goggles. Skin contact: gloves. Clothing/body: lab coat. Hot items: heat gloves. UV: UV-blocking goggles/face shield. Always: closed-toe shoes, long hair tied back.");
C(9,"How to label a solution","Name/contents, concentration, date prepared, your initials, and hazard warnings if any.");
C(10,"Equipment uses: microcentrifuge, micropipette, serological pipette, spectrophotometer","Microcentrifuge: spins small tubes to pellet or collect.\nMicropipette: measures/transfers microliters.\nSerological pipette: measures/transfers mL volumes.\nSpectrophotometer: measures absorbance of light.");
C(10,"Equipment uses: gel electrophoresis, vortex, thermal cycler","Gel electrophoresis apparatus: separates DNA/RNA/proteins by size with electric current.\nVortex: mixes a tube by vibration.\nThermal cycler (PCR): cycles temperatures to amplify DNA.");
C(11,"Where are the picofuge, microcentrifuge, micropipettes, tips, and microtubes kept?","These are specific to your classroom. Open Coverage and write where each item is kept in your notes for topic 11.");
C(12,"Steps to use a micropipette","1) Choose the right pipette and set volume within range.\n2) Attach a tip firmly.\n3) Press to first stop.\n4) Insert tip below the liquid surface, release slowly.\n5) Move to target tube.\n6) Dispense: press to first then second stop.\n7) Eject tip. Keep pipette upright with liquid in the tip.");
C(13,"How to read P-10 / P-100 / P-1000","Three-digit dial, read top to bottom.\nP-10 (about 0.5-10 µL): XX.X µL (last digit = tenths)\nP-100 (10-100 µL): XXX µL\nP-1000 (100-1000 µL): X.XX mL, i.e., each last digit is 10 µL.");
C(14,"Dial 089 on each pipette","P-10: 8.9 µL = 0.0089 mL\nP-100: 89 µL = 0.089 mL\nP-1000: 890 µL = 0.89 mL\n(1000 µL = 1 mL)");
C(15,"How to balance a microcentrifuge","Put tubes directly across from each other (opposite positions) with equal volumes/weights. Odd number of samples? Use a balance tube with the same volume of water. Close the lid before spinning.");

/* ===== C. Cheese-Making (16-21) ===== */
Q(16,"Milk is curdled by adding vinegar or lemon juice. Which cheese-making method is this?","Direct acid coagulation","Animal rennet","Bacterial starter culture","Recombinant chymosin","Acid lowers the pH, so casein proteins clump into curds without any enzyme.");
Q(16,"Bacteria such as Lactococcus are added to warm milk and allowed to ferment. This is the...","starter culture (lactic acid fermentation) method","animal rennet method","direct acid method","recombinant chymosin method","The bacteria eat lactose and make lactic acid, which lowers the pH and curdles the milk.");
Q(16,"Chymosin extracted from the stomach lining of young calves is used in which method?","Traditional animal rennet","Direct acid coagulation","Starter culture only","Recombinant chymosin","Rennet from calf stomach contains chymosin, a protease that clots milk.");
Q(16,"Which cheese method uses the chymosin gene inserted into bacteria, yeast, or mold that then mass-produce the enzyme?","Recombinant (fermentation-produced) chymosin","Animal rennet","Direct acid","Starter culture","The chymosin gene is cloned into a microbe, which makes pure chymosin in a fermenter.");
Q(16,"Which cheese-making method is an example of MODERN biotechnology?","Recombinant chymosin","Direct acid coagulation","Animal rennet","Starter culture fermentation","It depends on genetic engineering. The other methods use natural organisms or substances.");
Q(16,"Which pair of methods clots milk using the protease chymosin?","Animal rennet and recombinant chymosin","Acid and starter culture","Acid and animal rennet","Starter culture and recombinant chymosin","Both rennet types supply chymosin. Acid and starter cultures work by lowering pH.");
Q(16,"What is a main advantage of recombinant chymosin over animal rennet?","It is pure, consistent, cheaper, and does not require calves","It works without any milk proteins","It needs no enzyme","It makes lactic acid","Recombinant chymosin gives a reliable supply without slaughtering calves.");
Q(17,"What is casein?","The main protein in milk, which clumps to form curds","The sugar in milk","The fat in milk","The liquid left after cheese-making","Casein makes up about 80% of milk protein and forms the solid curd.");
Q(17,"Which substance in milk clots to form cheese curds?","Casein","Lactose","Whey","Lactic acid","Casein proteins clump together; lactose stays dissolved in the whey.");
Q(18,"What are proteases?","Enzymes that break down proteins","Enzymes that copy DNA","Sugars in milk","Bacteria used for yogurt","Proteases cut peptide bonds in proteins. Chymosin is a protease that clots milk casein.");
Q(18,"How does the protease chymosin help make cheese?","It cuts casein so the milk proteins clump into curds","It digests lactose into lactic acid","It kills bacteria","It lowers the pH by itself","Chymosin cleaves a stabilizing casein region, letting the casein aggregate into curd.");
Q(19,"How is lactic acid produced in starter-culture cheese production?","Bacteria ferment lactose (milk sugar) into lactic acid","Proteases digest casein into lactic acid","Heat converts whey to lactic acid","Yeast turns fat into lactic acid","Lactic acid bacteria ferment lactose. The acid lowers the pH, and casein clumps.");
Q(19,"What does the lactic acid do to milk during cheese-making?","Lowers the pH so casein clumps into curds","Raises the pH","Breaks down fat","Kills all microbes instantly","Acidity destabilizes casein so it precipitates.");
Q(20,"What are curd and whey?","Curd is the solid casein clumps; whey is the liquid that remains","Curd is the liquid; whey is the solid","Curd is lactose; whey is casein","Curd is fat; whey is salt","Curds are pressed to make cheese; whey contains water, lactose, and some proteins.");
Q(20,"After milk curdles, the liquid that is drained away is called...","whey","curd","casein","rennet","Whey is drained off the solid curd.");
Q(21,"When calibrating a pH meter, you should...","rinse the probe and use standard buffer solutions of known pH (e.g., 4, 7, 10)","dip it only in distilled water","use tap water as the standard","skip rinsing between buffers","Standard buffers with known pH set the meter's scale. Rinse with distilled water between solutions.");
Q(21,"Which is part of calibrating an electronic balance?","Level it, tare with a weigh boat or container, and check with a known calibration weight","Place the sample directly on the pan","Weigh with the draft shield open","Skip zeroing","Zero (tare) the container so you only weigh the sample. Calibration weights verify accuracy.");
Q(21,"Why do we rinse a pH probe with distilled water between buffers?","To prevent cross-contamination that would give inaccurate readings","To make the buffers more acidic","To heat the probe","To sterilize the buffer","Carrying one solution into another changes its pH and ruins calibration.");
C(16,"Four ways cheese can be made (check against class notes)","1) Direct ACID (vinegar/lemon juice + heat): low pH clumps casein.\n2) STARTER CULTURE: bacteria ferment lactose to lactic acid.\n3) Animal RENNET: chymosin (a protease) from calf stomach cuts casein.\n4) RECOMBINANT chymosin: gene put in microbes that mass-produce chymosin (modern biotech).");
C(17,"Casein","The main protein in milk. Clumps into curds when acidified or cut by chymosin.");
C(18,"Proteases","Enzymes that break down proteins by cutting peptide bonds. Chymosin (rennet) is a protease used for cheese.");
C(19,"How lactic acid forms in cheese-making","Lactic acid bacteria (starter culture) ferment lactose into lactic acid. The pH drops and casein clumps into curds.");
C(20,"Curd and whey","CURD: solid clumps of casein (become cheese).\nWHEY: liquid left behind (water, lactose, some proteins).");
C(21,"Calibrating a pH meter and an electronic balance","pH meter: rinse probe, place in standard buffers of known pH (e.g., 4, 7, 10), calibrate, rinse with distilled water between buffers.\nBalance: level it, clean pan, tare container, check with calibration weight.");

/* ===== D. Cell Structure (22-26) ===== */
Q(22,"Which feature is found in prokaryotic cells?","DNA in a nucleoid region with no nucleus","A membrane-bound nucleus","Mitochondria","An endoplasmic reticulum","Prokaryotes lack a nucleus and membrane-bound organelles. Their DNA sits in the nucleoid.");
Q(22,"Compared to prokaryotes, eukaryotic cells are generally...","larger, with a nucleus and membrane-bound organelles","smaller, with no organelles at all","always unicellular","lacking DNA","Eukaryotes (plants, animals, fungi, protists) have a nucleus and membrane-bound organelles.");
Q(22,"Which pair is correct?","Prokaryote: circular DNA; Eukaryote: linear chromosomes in a nucleus","Prokaryote: linear chromosomes; Eukaryote: no DNA","Prokaryote: nucleus; Eukaryote: nucleoid","Prokaryote: mitochondria; Eukaryote: none","Prokaryotes usually have a single circular chromosome (plus plasmids). Eukaryotes have multiple linear chromosomes.");
Q(23,"Which organelle houses the cell's DNA and controls cell activities?","Nucleus","Lysosome","Vacuole","Golgi apparatus","The nucleus stores DNA and is the site of transcription.");
Q(23,"What is the role of the endoplasmic reticulum (ER)?","Makes and transports proteins (rough ER) and lipids (smooth ER)","Produces ATP","Digests waste","Photosynthesis","Rough ER has ribosomes and makes proteins; smooth ER makes lipids and detoxifies.");
Q(23,"The Golgi apparatus...","modifies, sorts, and packages proteins for delivery","makes ATP","stores DNA","carries out photosynthesis","Think of it as the cell's post office: it tags and ships proteins.");
Q(23,"The plasma membrane...","controls what enters and leaves the cell","provides rigid support outside the cell","stores water","digests old organelles","It is a selectively permeable phospholipid barrier around every cell.");
Q(23,"The cell wall...","provides rigid support and protection (plants, bacteria, fungi)","makes ATP","digests waste","holds the nucleus","Plant cell walls contain cellulose. Animal cells do not have cell walls.");
Q(23,"The vacuole...","stores water, nutrients, and wastes","makes proteins","produces ATP","copies DNA","Plant cells have a large central vacuole that also helps keep the cell firm.");
Q(23,"Which organelle produces most of the cell's ATP?","Mitochondria","Chloroplast","Nucleus","Golgi apparatus","Mitochondria perform cellular respiration.");
Q(23,"Which organelle carries out photosynthesis?","Chloroplast","Mitochondria","Lysosome","Vacuole","Chloroplasts capture light energy to make sugar (plants and algae).");
Q(23,"Lysosomes...","contain enzymes that digest waste, old organelles, and invaders","make ATP","store genetic material","package proteins","Lysosomes are the cell's recycling/digestive centers.");
Q(24,"Which structure is found in plant cells but NOT animal cells?","Chloroplasts and a cell wall","Mitochondria","Nucleus","Plasma membrane","Plants also have a large central vacuole. Animal cells have lysosomes and small vacuoles, and no cell wall.");
Q(24,"Which statement about plant versus animal cells is true?","Both have mitochondria and a nucleus","Only animal cells have mitochondria","Only plant cells have a nucleus","Animal cells have cell walls","Both are eukaryotic cells with nuclei and mitochondria.");
Q(25,"What is a nucleosome?","DNA wrapped around a core of histone proteins","A type of ribosome","A single nucleotide","A chromosome arm","A nucleosome is about 147 base pairs of DNA wound around 8 histones, like beads on a string.");
Q(25,"Nucleosomes are important because they...","help package long DNA into the nucleus","make proteins","copy DNA","carry amino acids","Nucleosomes start the compaction of DNA into chromatin and chromosomes.");
Q(26,"What are histones?","Proteins that DNA wraps around","Enzymes that copy DNA","RNA molecules","Sugars in DNA","Histones are positively charged proteins that bind negatively charged DNA.");
Q(26,"Why do histones bind DNA tightly?","They are positively charged and DNA is negatively charged","They are hydrophobic","They contain thymine","They are made of RNA","Opposite charges attract: histones (positive) attract the phosphate backbone (negative).");
C(22,"Prokaryotic vs eukaryotic cells","PROKARYOTE: no nucleus (DNA in nucleoid), no membrane-bound organelles, small, circular DNA, plasmids, unicellular (bacteria).\nEUKARYOTE: nucleus, membrane-bound organelles, larger, linear chromosomes, uni- or multicellular.");
C(23,"Organelle functions (1/2)","Nucleus: stores DNA, controls cell.\nER: makes/transports proteins (rough) and lipids (smooth).\nGolgi: modifies, sorts, packages proteins.\nPlasma membrane: controls what enters/leaves.\nCell wall: rigid support/protection.");
C(23,"Organelle functions (2/2)","Vacuole: stores water, nutrients, waste.\nMitochondria: makes ATP (cell respiration).\nChloroplast: photosynthesis.\nLysosome: digests waste and worn-out organelles.");
C(24,"Animal vs plant cells","PLANT only: cell wall, chloroplasts, large central vacuole.\nANIMAL: lysosomes, small vacuoles, no cell wall or chloroplasts. Both have nucleus, mitochondria, ER, Golgi, plasma membrane.");
C(25,"Nucleosome","DNA wrapped around a core of histone proteins ('beads on a string'). The first level of DNA packaging.");
C(26,"Histones","Positively charged proteins that DNA wraps around to form nucleosomes. They package DNA and help regulate gene access.");
/* ===== E. Central Dogma & Nucleotide/DNA Structure (27-34) ===== */
Q(27,"What is the central dogma of molecular biology?","DNA is transcribed to RNA, which is translated into protein","Protein is translated into RNA, then DNA","RNA is replicated into DNA, then protein","DNA is translated into RNA, then transcribed into protein","Flow of genetic information: DNA to RNA (transcription), RNA to protein (translation). DNA also copies itself (replication).");
Q(27,"In the central dogma, which step makes mRNA?","Transcription","Translation","Replication","Mitosis","Transcription: DNA template to mRNA. Translation: mRNA to protein.");
Q(28,"What is the purpose of DNA replication?","To copy DNA before a cell divides","To make mRNA","To make protein","To digest DNA","Each daughter cell needs a full copy of the genome.");
Q(28,"What is the purpose of translation?","To build a protein (polypeptide) using the mRNA code","To copy DNA","To make mRNA from DNA","To split cells","Ribosomes read mRNA codons and assemble amino acids.");
Q(28,"Match each process with its product.","Replication: DNA; transcription: RNA; translation: protein","Replication: RNA; transcription: protein; translation: DNA","Replication: protein; transcription: DNA; translation: RNA","Replication: RNA; transcription: DNA; translation: DNA","Replication makes DNA, transcription makes RNA, translation makes protein.");
Q(29,"What are the three components of a nucleotide?","A phosphate group, a 5-carbon sugar, and a nitrogenous base","An amino acid, a sugar, and a lipid","A phosphate, a protein, and a base","A sugar, a fatty acid, and a base","DNA nucleotides contain deoxyribose; RNA nucleotides contain ribose.");
Q(29,"Which is NOT a part of a nucleotide?","Amino acid","Phosphate group","Sugar","Nitrogenous base","Amino acids build proteins, not nucleotides.");
Q(30,"How do purines differ from pyrimidines?","Purines have two rings; pyrimidines have one ring","Purines have one ring; pyrimidines have two rings","Purines are in DNA only; pyrimidines are in RNA only","Purines contain sulfur","Purines (A, G) are double-ringed and larger. Pyrimidines (C, T, U) are single-ringed.");
Q(30,"A purine always pairs with a pyrimidine so that...","the width of the DNA helix stays constant","the strands stay parallel","hydrogen bonds are avoided","the sugar changes","Large (2-ring) with small (1-ring) keeps a uniform width.");
Q(31,"Which bases are purines?","Adenine and guanine","Cytosine and thymine","Thymine and uracil","Adenine and cytosine","Purines: A, G ('Pure As Gold'). Pyrimidines: C, T, U ('CUT the Py').");
Q(31,"Which bases are pyrimidines?","Cytosine, thymine, and uracil","Adenine, guanine, and thymine","Adenine and cytosine","Guanine and uracil","C, T, and U have single rings.");
Q(32,"In a DNA strand, the 5' end has...","a free phosphate group","a free hydroxyl (-OH) on the 3' carbon","a free base","a free amino group","5' end = phosphate on the 5' carbon. 3' end = free OH on the 3' carbon.");
Q(32,"Which statement about the structure of DNA is correct?","A double helix with a sugar-phosphate backbone and bases paired in the middle","A single strand with bases outside","A double helix with bases on the outside","Two parallel strands with uracil","Backbone (deoxyribose + phosphate) on the outside, base pairs inside.");
Q(33,"How are nucleotides linked together in one DNA strand?","Phosphodiester bonds between the sugar of one and the phosphate of the next","Hydrogen bonds between bases","Peptide bonds","Ionic bonds between strands","Phosphodiester bonds form the backbone (3' OH to 5' phosphate).");
Q(33,"What holds the two DNA strands together?","Hydrogen bonds between base pairs","Phosphodiester bonds","Peptide bonds","Covalent bonds between sugars","Hydrogen bonds are weak individually, so the strands can be unzipped.");
Q(34,"According to base pairing rules, adenine pairs with...","thymine in DNA (uracil in RNA)","guanine","cytosine","adenine","A pairs with T (2 H-bonds); G pairs with C (3 H-bonds).");
Q(34,"How many hydrogen bonds join G and C?","3","2","1","4","G-C has 3; A-T has 2.");
Q(34,"If one DNA strand is 5'-ATGC-3', the complementary strand is...","3'-TACG-5'","3'-ATGC-5'","5'-TACG-3'","3'-UACG-5'","Pair A-T, T-A, G-C, C-G and flip the direction (antiparallel).");
C(27,"Central dogma","DNA → RNA → protein.\nTranscription: DNA → mRNA. Translation: mRNA → protein. (DNA also copies itself: replication.)");
C(28,"Purpose of replication, transcription, translation","Replication: copy DNA before cell division.\nTranscription: make RNA copy of a gene.\nTranslation: make a protein from mRNA.");
C(29,"Three components of a nucleotide","Phosphate group + 5-carbon sugar (deoxyribose in DNA, ribose in RNA) + nitrogenous base.");
C(30,"Purines vs pyrimidines","PURINES: two rings (A, G).\nPYRIMIDINES: one ring (C, T, U).");
C(31,"Which bases are which?","Purines: Adenine, Guanine ('Pure As Gold').\nPyrimidines: Cytosine, Thymine, Uracil ('CUT the Py').");
C(32,"Structure of DNA (what to draw)","Two strands forming a double helix. Each nucleotide: deoxyribose (sugar) + phosphate + nitrogenous base. Backbone = sugar-phosphate. Bases pair in the middle (A=T, G≡C). One strand runs 5' to 3', the other 3' to 5'. 5' end: free phosphate. 3' end: free OH.");
C(33,"How nucleotides are linked","Along a strand: phosphodiester bonds (covalent, sugar to phosphate).\nBetween strands: hydrogen bonds between bases.");
C(34,"Base pairing rules","A pairs with T (2 H-bonds). G pairs with C (3 H-bonds). In RNA, A pairs with U.");

/* ===== F. DNA Replication (35-41) ===== */
Q(35,"Why does a cell replicate its DNA?","So each new cell receives a complete copy of the genome","To make proteins","To make mRNA","To produce energy","Replication happens before cell division.");
Q(36,"What is the purpose of mitosis?","To produce two genetically identical cells for growth and repair","To produce gametes","To make proteins","To copy RNA","Mitosis makes identical diploid daughter cells. Meiosis makes gametes.");
Q(36,"Before mitosis, the DNA is...","replicated so each chromosome has two sister chromatids","destroyed","translated","split into RNA","DNA replication (S phase) makes each chromosome a pair of identical chromatids.");
Q(37,"What is a chromosome?","A long DNA molecule packaged with proteins","A protein that copies DNA","A single nucleotide","A type of RNA","Chromosomes are tightly coiled DNA plus histones.");
Q(37,"What is the centromere?","The region where two sister chromatids are joined","The end of a chromosome","A gene that codes for protein","A type of histone","The centromere holds sister chromatids together and attaches to spindle fibers.");
Q(37,"What are sister chromatids?","Two identical copies of a replicated chromosome","Two different chromosomes from each parent","Pieces of RNA","Two histone proteins","Sister chromatids are identical copies made by replication.");
Q(38,"DNA strands are 'complementary,' meaning...","the bases on one strand pair with the bases on the other (A-T, G-C)","both strands have identical sequences","both strands run 5' to 3'","they contain different sugars","Each strand's sequence determines its partner's sequence.");
Q(38,"DNA strands are 'antiparallel,' meaning...","they run in opposite directions (5' to 3' and 3' to 5')","they run the same direction","they are made of RNA","they never pair","One strand runs 5' to 3' while the other runs 3' to 5'.");
Q(38,"Semiconservative replication means each new DNA molecule...","has one old strand and one newly synthesized strand","has two new strands","has two old strands","is made of RNA","Shown by the Meselson-Stahl experiment.");
Q(39,"What does helicase do?","Unwinds and separates the DNA strands by breaking hydrogen bonds","Seals DNA fragments","Makes the RNA primer","Adds nucleotides","Helicase unzips the double helix to form the replication fork.");
Q(39,"What is the function of gyrase/topoisomerase in replication?","Relieves twisting strain (supercoiling) ahead of the replication fork","Seals gaps between Okazaki fragments","Adds RNA primer","Reads mRNA","Unwinding causes tension ahead of the fork. Topoisomerases (gyrase is one in bacteria) cut and rejoin DNA to relax it.");
Q(39,"What is the replication fork?","The Y-shaped region where the DNA is being unwound and copied","The end of a chromosome","A type of polymerase","The start codon","The fork moves along as the helix is unzipped.");
Q(39,"What do single-strand DNA binding proteins do?","Keep the separated strands apart so they do not re-pair","Seal nicks","Make primers","Make RNA","They coat single-stranded DNA and prevent it from snapping back.");
Q(39,"What does primase do?","Makes a short RNA primer that gives DNA polymerase a starting point","Unwinds DNA","Joins Okazaki fragments","Relieves supercoiling","DNA polymerase can only add to an existing 3' end, so primase supplies the primer.");
Q(39,"What does DNA polymerase do?","Adds complementary nucleotides to the 3' end, building the new strand","Unwinds the helix","Makes the RNA primer","Seals nicks","Polymerase matches bases to the template strand and proofreads.");
Q(39,"The leading strand is...","synthesized continuously toward the replication fork","synthesized in fragments","synthesized away from the fork only","made of RNA","Its template lets polymerase follow the fork, so one primer is enough.");
Q(39,"The lagging strand is...","synthesized discontinuously as Okazaki fragments away from the fork","synthesized continuously","synthesized 3' to 5'","made without primers","It is built in short pieces, each needing a primer.");
Q(39,"Okazaki fragments are...","short DNA fragments on the lagging strand","RNA primers","proteins","the origin of replication","They are later joined into one continuous strand.");
Q(39,"What does DNA ligase do?","Joins (seals) Okazaki fragments and nicks in the sugar-phosphate backbone","Unwinds DNA","Makes primers","Reads DNA","Ligase forms phosphodiester bonds to complete the lagging strand.");
Q(39,"Which correctly orders replication events?","Helicase unwinds, binding proteins stabilize, primase adds primer, polymerase extends, ligase seals","Ligase seals, helicase unwinds, primase extends, polymerase unwinds","Polymerase primes, helicase seals, ligase unwinds, primase extends","Primase unwinds, ligase primes, helicase extends, polymerase seals","Unwind, stabilize, prime, extend, seal.");
Q(40,"In what direction does DNA polymerase read the template strand?","3' to 5'","5' to 3'","Both directions","Randomly","Polymerase reads the template 3' to 5'.");
Q(41,"In what direction does DNA polymerase build the new strand?","5' to 3'","3' to 5'","Both directions","Only toward the end","Nucleotides are added to the 3' OH, so growth is 5' to 3'.");
Q(41,"Why is the lagging strand made in fragments?","Polymerase can only build 5' to 3', which is away from the fork on that strand","Helicase cannot unwind it","It has no template","It is made of RNA","The fork opens in one direction, so the strand built away from it must be made piece by piece.");
C(35,"Purpose of DNA replication","Copy the genome so each new cell gets a complete set of DNA (occurs before cell division).");
C(36,"Purpose of mitosis","Produces two genetically identical daughter cells for growth, repair, and replacement of cells.");
C(37,"Chromosome, centromere, chromatid","CHROMOSOME: long DNA molecule packaged with proteins.\nCHROMATIDS: two identical copies of a replicated chromosome.\nCENTROMERE: region joining sister chromatids.");
C(38,"Complementary, antiparallel, semiconservative","COMPLEMENTARY: bases pair A-T, G-C.\nANTIPARALLEL: strands run opposite directions (5'→3' and 3'→5').\nSEMICONSERVATIVE: each new DNA has one old and one new strand.");
C(39,"Replication proteins (1/2)","Helicase: unwinds/unzips DNA (breaks H-bonds).\nGyrase/topoisomerase: relieve twisting strain ahead of fork.\nReplication fork: Y-shaped region of unwinding.\nDNA binding proteins: keep strands apart.");
C(39,"Replication proteins (2/2)","Primase: makes RNA primer.\nDNA polymerase: adds nucleotides to 3' end.\nLeading strand: continuous.\nLagging strand: Okazaki fragments (discontinuous).\nLigase: seals fragments together.");
C(40,"Direction DNA polymerase READS","Reads the template strand 3' to 5'.");
C(41,"Direction DNA polymerase BUILDS","Builds the new strand 5' to 3' (adds to the 3' end).");

/* ===== G. Plasmids, Competency & pGLO (42-54) ===== */
Q(42,"What is a plasmid?","A small, circular piece of DNA separate from the main chromosome in bacteria","A type of RNA","A protein that cuts DNA","The nucleus of a bacterium","Plasmids replicate independently and often carry useful genes such as antibiotic resistance.");
Q(42,"Which is true about plasmids?","They are extra-chromosomal, circular DNA that can be copied independently","They are linear chromosomes","They are made of protein","They are found only in humans","Plasmids are used as vehicles for moving genes.");
Q(43,"Why is a plasmid considered a vector?","It carries a gene into a host cell","It cuts DNA","It makes protein","It digests DNA","A vector is a vehicle for transferring DNA into cells.");
Q(43,"In the pGLO lab, the plasmid acts as a vector by...","carrying the GFP gene into E. coli","producing ampicillin","killing bacteria","digesting agar","pGLO delivers GFP, araC, and bla genes into the bacteria.");
Q(44,"What is the role of the ORI (origin of replication) in a plasmid?","It lets the plasmid be copied inside the host cell","It codes for GFP","It gives antibiotic resistance","It turns genes on","Without an ORI, the plasmid would not replicate and would be lost as the cells divide.");
Q(44,"If a plasmid had no ORI, what would happen?","It would not replicate and would be lost as bacteria divide","It would replicate faster","GFP would be brighter","It would become RNA","The ORI is the starting point for plasmid replication.");
Q(45,"What is a selective marker?","A gene that lets you select for cells that took up the plasmid, such as antibiotic resistance","A gene that makes DNA","A promoter","A sugar","Only transformed cells can survive on selective media.");
Q(45,"What was the selective marker in the pGLO lab?","The bla gene (beta-lactamase) giving ampicillin resistance","GFP","araC","Arabinose","Beta-lactamase breaks down ampicillin, so transformed cells survive on LB/amp plates.");
Q(46,"What does it mean for bacterial cells to be competent?","They are able to take up foreign DNA","They can make antibiotics","They are dead","They are resistant to heat","Competent cells can accept DNA from their environment.");
Q(46,"Which are two methods to make bacteria competent?","Chemical treatment (CaCl2 + heat shock) and electroporation","Autoclaving and freezing","UV light and vortexing","Centrifugation and filtration","Chemical (calcium chloride with heat shock) or electrical (electroporation) creates openings for DNA.");
Q(46,"Electroporation makes cells competent by...","using a brief electric pulse to create temporary pores","heating with CaCl2","adding antibiotics","adding arabinose","The electric pulse opens pores in the membrane so DNA can enter.");
Q(47,"What does genetic transformation mean?","A cell takes up foreign DNA and expresses the new gene(s), changing its traits","A cell divides in two","RNA is turned into protein","DNA is copied","In pGLO, bacteria acquire the ability to glow green and resist ampicillin.");
Q(47,"Which change shows successful transformation in the pGLO lab?","Bacteria growing on ampicillin and glowing under UV with arabinose","Bacteria dying on LB/amp","Bacteria glowing without arabinose","Bacteria changing shape","Successful transformation gives resistance and fluorescence when induced.");
Q(48,"Which genes/elements are on the pGLO plasmid?","GFP gene, araC gene, bla gene (amp resistance), promoter, and ORI","Insulin gene, lac gene, ORI","GFP only","Casein gene, GFP, pH gene","pGLO has GFP, bla (ampR), araC, pBAD promoter, and ori.");
Q(48,"What is the function of the bla gene on pGLO?","Codes for beta-lactamase, which destroys ampicillin","Codes for GFP","Codes for the araC protein","Is the origin of replication","It is the selective marker.");
Q(48,"What is the function of the GFP gene?","Codes for green fluorescent protein, which glows under UV light","Codes for araC","Gives ampicillin resistance","Replicates the plasmid","GFP originally came from a jellyfish.");
Q(49,"Which is the correct order of steps in the pGLO transformation?","CaCl2 + DNA on ice, heat shock, add LB and recover, plate, incubate","Plate, heat shock, add LB, add DNA","Heat shock, add DNA, add CaCl2, plate","Add LB, plate, add DNA, heat shock","Cold CaCl2 and DNA, then quick heat shock, then LB recovery, then plating and incubation.");
Q(49,"Why are the cells kept on ice before and after heat shock?","The cold helps DNA stick to cells and the temperature change makes the membrane permeable","To kill bacteria","To activate GFP","To make arabinose","Ice/heat/ice creates a temperature imbalance that helps DNA enter.");
Q(50,"What is the function of the CaCl2 transformation solution?","Calcium ions neutralize the negative charges on DNA and the cell membrane so DNA can approach the cell","Kills bacteria","Activates GFP","Feeds the cells","Both DNA and membranes are negatively charged, so they repel. Ca2+ shields the charges.");
Q(50,"What does heat shock do in transformation?","Creates a temperature imbalance that helps DNA move into the cell","Turns on the GFP gene","Kills the cells","Makes ampicillin","Sudden heat (42°C about 50 s) makes the membrane more permeable.");
Q(50,"Why is LB broth added after heat shock?","It provides nutrients so the cells can recover and start expressing the new genes","It kills untransformed cells","It turns on GFP","It adds CaCl2","Cells need time and food to make beta-lactamase before seeing ampicillin.");
Q(51,"What is arabinose?","A sugar that turns on the GFP gene in pGLO","An antibiotic","A protein","A nucleotide","Arabinose is the inducer that controls the pBAD promoter.");
Q(51,"Arabinose in the pGLO lab is used to...","switch on GFP expression","kill bacteria","provide ampicillin resistance","replicate DNA","Without arabinose, GFP stays off.");
Q(52,"In the pGLO system, what does the araC protein do when arabinose is ABSENT?","Binds the promoter region and blocks RNA polymerase (gene OFF)","Activates GFP","Copies DNA","Cuts DNA","Without arabinose the araC protein blocks transcription.");
Q(52,"What happens when arabinose is PRESENT?","Arabinose binds araC protein, changing its shape so RNA polymerase can bind the promoter and transcribe GFP (ON)","araC destroys arabinose","GFP is cut","RNA polymerase is destroyed","The araC-arabinose complex allows RNA polymerase to start transcription.");
Q(52,"What is the role of RNA polymerase in the pGLO system?","Transcribes the GFP gene into mRNA once the promoter is available","Makes the GFP protein","Makes arabinose","Copies the plasmid","mRNA is then translated into GFP.");
Q(52,"Which correctly describes the order that produces glowing bacteria?","Arabinose binds araC protein, RNA polymerase binds the promoter, GFP gene is transcribed and translated, GFP glows","GFP glows, then araC is made","RNA polymerase makes arabinose","araC makes GFP directly","Regulatory chain: arabinose to araC to promoter to transcription to translation.");
Q(53,"Which media were used in the pGLO lab?","LB, LB/amp, and LB/amp/ara","Only LB","Only LB/amp","Saline and water","The plates compare growth and fluorescence with and without plasmid, antibiotic, and sugar.");
Q(54,"Which plate showed growth AND green glow under UV?","+pGLO on LB/amp/ara","+pGLO on LB/amp","-pGLO on LB/amp","-pGLO on LB","Only transformed cells with arabinose express GFP.");
Q(54,"Why did +pGLO cells on LB/amp NOT glow?","No arabinose, so the GFP gene stayed OFF","They were dead","No plasmid was present","No ampicillin","They grew (amp resistance) but GFP was not induced.");
Q(54,"Why did -pGLO cells on LB/amp not grow?","They lacked the bla gene and could not resist ampicillin","No nutrients were present","GFP killed them","Arabinose killed them","Untransformed cells are killed by ampicillin.");
Q(54,"What is the purpose of -pGLO on plain LB?","Control showing the cells are viable and grow without selection","To test arabinose","To show glow","To test ampicillin","Shows that the bacteria can grow normally (lawn).");
C(42,"Plasmid","Small circular extra-chromosomal DNA in bacteria that replicates independently and often carries useful genes.");
C(43,"Why a plasmid is a vector","A vector carries foreign DNA into a host cell. Plasmids can carry a gene (like GFP) into bacteria.");
C(44,"ORI (origin of replication)","Starting point for copying the plasmid, so it can replicate in the host cell.");
C(45,"Selective marker; pGLO's marker","Selective marker: gene that lets you select for cells that took up the plasmid (e.g., antibiotic resistance).\npGLO: bla gene (beta-lactamase) = ampicillin resistance.");
C(46,"Competent cells: meaning and two methods","Competent = able to take up foreign DNA.\nMethods: (1) chemical: CaCl2 + heat shock, (2) electroporation (electric pulse).");
C(47,"Genetic transformation","A cell takes up foreign DNA and expresses its gene(s), changing the cell's traits.");
C(48,"pGLO parts and functions","GFP gene: makes green fluorescent protein.\nbla gene: ampicillin resistance (selective marker).\naraC gene: makes araC protein (regulator).\nPromoter (pBAD/operon): where RNA polymerase binds and araC acts.\nORI: lets plasmid replicate.");
C(49,"Steps of genetic transformation (pGLO)","1) Suspend cells in cold CaCl2.\n2) Add pGLO DNA, keep on ice.\n3) Heat shock (42°C, about 50 s).\n4) Back on ice.\n5) Add LB broth, recover.\n6) Plate on LB, LB/amp, LB/amp/ara.\n7) Incubate 24-48 h.");
C(50,"Function of CaCl2, heat shock, and LB","CaCl2: Ca2+ neutralizes negative charges on DNA and membrane so DNA can approach.\nHeat shock: temperature imbalance helps DNA enter the cell.\nLB: nutrients so cells recover and express the new genes.");
C(51,"Arabinose","A sugar that acts as the inducer of the GFP gene in pGLO. It turns GFP ON.");
C(52,"How GFP is turned ON or OFF (pGLO)","OFF (no arabinose): araC protein binds the promoter/operon and blocks RNA polymerase.\nON (arabinose present): arabinose binds araC protein, it lets go, RNA polymerase binds the promoter and transcribes the GFP gene, mRNA is translated to GFP.");
C(53,"Media used in pGLO lab","LB (no antibiotic), LB/amp (ampicillin), LB/amp/ara (ampicillin plus arabinose).");
C(54,"Plate results and why","+pGLO LB/amp/ara: growth and glows (amp resistance, GFP ON).\n+pGLO LB/amp: growth, no glow (GFP OFF).\n-pGLO LB/amp: no growth (no resistance).\n-pGLO LB: lawn, no glow (no plasmid, no selection).");

/* ===== H. Chromatography & GFP Purification (55-58) ===== */
Q(55,"What is chromatography used for in biotechnology?","To separate and purify molecules in a mixture, such as proteins","To copy DNA","To measure pH","To sterilize equipment","Different molecules move differently through a matrix based on size, charge, or hydrophobicity.");
Q(55,"Chromatography separates molecules based on differences in...","physical/chemical properties such as size, charge, or hydrophobicity","color only","the number of cells","temperature only","Each column type uses a different property.");
Q(56,"Which are types of column chromatography?","Size exclusion, ion exchange, affinity, and hydrophobic interaction","Only size exclusion","PCR and electrophoresis","Gram staining and plating","Each method separates based on a different property.");
Q(56,"Which type of column chromatography was used to purify GFP in class?","Hydrophobic interaction chromatography","Size exclusion","Ion exchange","Affinity with antibodies","Salt concentration controls whether GFP binds the hydrophobic beads.");
Q(57,"What is the function of lysozyme in the GFP lab?","Breaks down the bacterial cell wall so GFP is released","Binds GFP to the column","Makes GFP glow","Digests DNA","Lysozyme digests peptidoglycan in the wall, allowing lysis.");
Q(57,"Lysozyme is used in the purification to...","lyse (burst) the bacteria to release proteins","feed the bacteria","add antibiotics","bind GFP","Without lysis, GFP would stay inside the cells.");
Q(58,"In the GFP purification, why is high salt added to the sample/column?","High salt promotes hydrophobic interactions so GFP sticks to the column","Salt digests proteins","Salt makes GFP glow","Salt removes the column","High salt exposes hydrophobic regions, which bind the hydrophobic beads.");
Q(58,"What is the purpose of the wash buffer?","Removes hydrophilic proteins while GFP stays bound","Elutes GFP","Lyses cells","Binds DNA","Intermediate salt washes off weakly bound proteins.");
Q(58,"What is the purpose of the elution (low-salt) buffer?","Releases GFP from the column so it can be collected","Binds more GFP","Digests the cell wall","Denatures DNA","Low salt reduces hydrophobic interaction, so GFP comes off.");
Q(58,"Which proteins pass through the column first?","Hydrophilic proteins","Hydrophobic proteins like GFP","DNA only","Lysozyme only","Hydrophilic proteins do not stick to hydrophobic beads.");
Q(58,"Which correctly orders GFP purification?","Lyse with lysozyme, spin and collect supernatant, add high-salt binding, load column, wash, elute","Elute, load, wash, lyse","Wash, elute, lyse, load","Load, lyse, elute, wash","Lyse cells, clear debris, bind GFP to column, wash, elute.");
C(55,"Chromatography in biotech","Separates and purifies molecules (e.g., proteins) from a mixture based on properties such as size, charge, or hydrophobicity.");
C(56,"Types of column chromatography","Size exclusion (gel filtration), ion exchange, affinity, hydrophobic interaction (HIC).\nClass used: HYDROPHOBIC INTERACTION chromatography.");
C(57,"Lysozyme","Enzyme that digests the peptidoglycan cell wall of bacteria, bursting them open so GFP is released.");
C(58,"GFP purification steps and buffers","1) Lyse bacteria with lysozyme.\n2) Spin to remove debris, keep supernatant.\n3) Add high-salt binding/equilibration buffer: GFP (hydrophobic) binds hydrophobic beads.\n4) Wash buffer (medium salt): removes hydrophilic proteins.\n5) Elution buffer (low salt): releases GFP.\nHydrophobic regions stick in high salt; hydrophilic proteins flow through.");
/* ===== I. Transcription (59-68) ===== */
Q(59,"What is the purpose of transcription?","To make an RNA (mRNA) copy of a gene from the DNA","To copy the whole genome","To build a protein","To divide the cell","Transcription copies a gene's DNA sequence into RNA so the information can leave the nucleus.");

const KEY='biotechMidtermV1';
let S=loadState();
function blank(){return {v:1,q:{},f:{},cov:{},notes:{},exams:[],tipDismissed:false}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return Object.assign(blank(),s)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const view=$('#view'),tabs=$('#tabs');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clusterOf(n){return CLUSTERS.find(c=>n>=c.from&&n<=c.to)}
function qCluster(q){return clusterOf(q.t[0])}
const LET=['A','B','C','D'];
const ALLN=Array.from({length:82},(_,i)=>i+1);
function mcqForTopic(n){return MCQ.filter(q=>q.t.includes(n))}
function cardsForTopic(n){return CARDS.filter(c=>c.t.includes(n))}
function qstat(id){return S.q[id]}
function record(id,ok){
  const s=S.q[id]||(S.q[id]={seen:0,correct:0,wrong:0,last:0,streak:0,lastOk:null});
  s.seen++;ok?s.correct++:s.wrong++;s.streak=ok?s.streak+1:0;s.lastOk=ok;s.last=Date.now();save();
}
function isMissed(q){const s=S.q[q.id];return !!(s&&s.wrong>0&&s.streak<2)}
function isMastered(q){const s=S.q[q.id];return !!(s&&s.streak>=2)}
function drilled(n){return mcqForTopic(n).some(q=>S.q[q.id]&&S.q[q.id].seen>0)}
function accuracy(){let c=0,w=0;for(const k in S.q){c+=S.q[k].correct;w+=S.q[k].wrong}return c+w?Math.round(100*c/(c+w)):null}
function clusterStats(c){
  const qs=MCQ.filter(q=>qCluster(q).id===c.id);
  let mastered=0,seen=0,cor=0,wr=0;
  qs.forEach(q=>{const s=S.q[q.id];if(s){if(s.seen>0)seen++;if(s.streak>=2)mastered++;cor+=s.correct;wr+=s.wrong}});
  return {total:qs.length,mastered,seen,acc:cor+wr?Math.round(100*cor/(cor+wr)):null,qs};
}
function status(n){return S.cov[n]||'new'}
function pct(a,b){return b?Math.round(100*a/b):0}

/* ================= HOME ================= */
function ringSVG(){
  const cx=150,cy=150,r1=104,r2=136,n=82;let t='';
  for(let i=0;i<n;i++){
    const a=(i/n)*2*Math.PI-Math.PI/2,ca=Math.cos(a),sa=Math.sin(a);
    const st=status(i+1),d=drilled(i+1);
    let col='var(--tick)';
    if(st==='conf')col='var(--conf)';else if(d||st==='rev')col='var(--amber)';
    t+=`<line x1="${(cx+r1*ca).toFixed(1)}" y1="${(cy+r1*sa).toFixed(1)}" x2="${(cx+r2*ca).toFixed(1)}" y2="${(cy+r2*sa).toFixed(1)}" stroke="${col}" stroke-width="${(2*Math.PI*r2/n*.58).toFixed(1)}" stroke-linecap="round"/>`;
  }
  const done=ALLN.filter(n=>drilled(n)||status(n)==='conf').length;
  return `<svg class="ring" viewBox="0 0 300 300" role="img" aria-label="${done} of 82 topics drilled">${t}
  <text x="150" y="152" text-anchor="middle" font-size="52" font-weight="800" fill="var(--ink)">${done}</text>
  <text x="150" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="var(--mute)">of 82 topics touched</text></svg>`;
}

  return `<div class="hdr"><h1>Biotech Midterm Prep</h1><p>70 questions next week. 82 review topics. Zero gaps.</p></div>

   <div class="stats"><div><b>${dr}/82</b><span>topics drilled</span></div><div><b>${conf}/82</b><span>marked confident</span></div><div><b>${acc===null?'--':acc+'%'}</b><span>quiz accuracy</span></div></div>
