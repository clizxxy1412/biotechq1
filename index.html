<style>
:root{
  --navy:#13294b;--navy2:#1d3c6b;--amber:#f2a51a;--amber-d:#b97a00;
  --bg:#eef1f7;--card:#ffffff;--ink:#0f1b33;--mute:#5a6783;--line:#d9dfec;
  --ok:#14805a;--okbg:#e2f5ec;--bad:#c93a45;--badbg:#fbe6e8;--tick:#ccd3e2;
  --conf:#13294b;
  --shadow:0 1px 2px rgba(19,41,75,.08);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1322;--card:#13213a;--ink:#e7ecf7;--mute:#9aa8c4;--line:#243659;
  --ok:#4fd1a0;--okbg:#0f3a2e;--bad:#ff7d87;--badbg:#431c22;--tick:#2a3b5f;--conf:#8fb4ff;--amber-d:#f2a51a;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Avenir Next","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;touch-action:manipulation}
#statusbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
#view{max-width:560px;margin:0 auto;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));min-height:100vh}
.hdr{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 22px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hdr h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hdr p{margin:6px 0 0;color:#b9c7e3;font-size:15px}
.hdr .row{display:flex;align-items:center;gap:12px}
.hdr .grow{flex:1;min-width:0}
.pad{padding:16px 16px 0}
h2{font-size:18px;margin:22px 4px 10px;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;border:0;border-radius:14px;
  font:inherit;font-weight:700;font-size:17px;background:var(--navy);color:#fff;cursor:pointer}
.btn.amber{background:var(--amber);color:#1b1402}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:44px;font-size:15px;padding:8px 14px;width:auto}
.btn[disabled]{opacity:.45}
.btn:active{transform:scale(.99)}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.stack>*+*{margin-top:10px}
.muted{color:var(--mute)}
.small{font-size:14px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.tag.amber{background:#fff3d6;color:#7a5200;border-color:#f2d58a}
@media (prefers-color-scheme:dark){.tag.amber{background:#3b2d08;color:#f2c766;border-color:#5b4510}}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs.hide{display:none}
#tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:11.5px;font-weight:600;padding:9px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;cursor:pointer}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--navy)}
@media (prefers-color-scheme:dark){#tabs button.on{color:var(--amber)}}
#tabs button.on svg{stroke-width:2.4}
/* ring */
.ring{display:block;margin:2px auto 0;width:100%;max-width:300px;height:auto}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12.5px;color:var(--mute)}
/* bars */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--navy)}
@media (prefers-color-scheme:dark){.bar .m{background:#8fb4ff}}
.bar .s{background:var(--amber)}
/* rows */
.row-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;color:var(--ink);min-height:60px;cursor:pointer}
.row-item .grow{flex:1;min-width:0}
.row-item b{display:block;font-size:16px;line-height:1.25}
.row-item .small{display:block}
.badge{flex:none;min-width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;padding:0 6px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--navy);color:#fff}
.qtop .btn{width:auto;min-height:40px;padding:6px 14px;font-size:15px;background:rgba(255,255,255,.14);color:#fff}
.qtop .grow{flex:1;text-align:center;font-weight:700}
.prog{height:5px;background:rgba(255,255,255,.18)}
.prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
.qtext{font-size:20px;line-height:1.35;font-weight:600;margin:10px 2px 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16.5px;color:var(--ink);
  background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-height:56px;cursor:pointer}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.opt.sel{border-color:var(--amber);background:rgba(242,165,26,.12)}
.opt.sel .l{background:var(--amber);border-color:var(--amber);color:#1b1402}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.expl{border-radius:14px;padding:14px;margin:4px 0 14px;font-size:15.5px}
.expl.ok{background:var(--okbg);border:1px solid var(--ok)}
.expl.no{background:var(--badbg);border:1px solid var(--bad)}
.expl b.v{display:block;margin-bottom:4px;font-size:16px}
.dock{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px))}
/* flashcard */
.fc{perspective:1200px;margin:6px 0 16px}
.fc .face{min-height:300px;border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;
  border:1px solid var(--line);white-space:pre-line}
.fc .front{background:var(--card);font-size:22px;font-weight:700;line-height:1.3}
.fc .back{background:var(--navy);color:#fff;font-size:18px;line-height:1.5;font-weight:500;border-color:var(--navy)}
.fc .hint{margin-top:16px;font-size:13px;font-weight:600;color:var(--mute)}
.fc .back .hint{color:#b9c7e3}
.note{background:#fff3d6;color:#5d4100;border-radius:12px;padding:10px 12px;font-size:14.5px;margin:8px 0}
@media (prefers-color-scheme:dark){.note{background:#3b2d08;color:#f2d58a}}
/* coverage */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{background:var(--amber);border-color:var(--amber);color:#1b1402}}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--tick)}
.dot.conf{background:var(--ok);border-color:var(--ok)}
.dot.rev{background:var(--amber);border-color:var(--amber)}
.ctitle{display:flex;align-items:center;gap:10px;margin:20px 4px 8px;font-weight:700;font-size:16px}
.ctitle small{font-weight:500;color:var(--mute);margin-left:auto}
.qrow{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.qhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;font:inherit;color:var(--ink);padding:12px 14px;min-height:58px;cursor:pointer}
.qhead .t{flex:1;min-width:0;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.qbody .full{font-size:15.5px;margin:12px 0;white-space:pre-line}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button.on.c{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.r{background:var(--amber);border-color:var(--amber);color:#1b1402}
.seg button.on.n{background:var(--mute);border-color:var(--mute);color:#fff}
textarea{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:84px;resize:vertical}
.tip{display:flex;gap:12px;align-items:flex-start;background:#fff3d6;color:#5d4100;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14.5px}
@media (prefers-color-scheme:dark){.tip{background:#3b2d08;color:#f2d58a}}
.tip button{flex:none;border:0;background:none;font:inherit;font-weight:700;color:inherit;padding:4px 6px;min-height:32px}
.big{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.02em}
.center{text-align:center}
.mt{margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== rewards ===== */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{background:var(--navy);color:#fff;border:1.5px solid var(--amber);padding:10px 16px 10px 12px;border-radius:16px;display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.25;
  box-shadow:0 10px 30px rgba(0,0,0,.28);animation:toastin .4s cubic-bezier(.2,1.3,.3,1),toastout .3s 1.95s forwards;max-width:420px}
@keyframes toastin{from{opacity:0;transform:translateY(-24px) scale(.92)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-14px)}}
.medal{flex:none;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--amber);color:#1b1402;font-weight:800;font-size:15px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.medal.sm{width:38px;height:38px;font-size:14px}
.xpfloat{position:fixed;z-index:75;pointer-events:none;font-weight:800;font-size:22px;color:var(--amber);text-shadow:0 2px 8px rgba(0,0,0,.35);animation:floatup .95s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(8px) scale(.8)}18%{opacity:1;transform:translateY(-4px) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
@keyframes pop{0%{transform:scale(.96)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flipin{from{transform:rotateY(78deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
@keyframes tk{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes starin{0%{opacity:0;transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.25) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.opt.pop{animation:pop .42s ease-out}
.opt.shake{animation:shake .42s ease-out}
.expl{animation:rise .3s ease-out}
.face.flipin{animation:flipin .28s ease-out}
.ring .tk{transform-box:fill-box;transform-origin:center}
.ring.intro .tk{animation:tk .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i) * 10ms)}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;padding:6px 12px;border-radius:99px;font-weight:700;font-size:15px}
.pill svg{width:17px;height:17px;fill:var(--amber)}
.pill.combo{margin-left:8px;background:var(--amber);color:#1b1402;animation:pop .35s ease-out}
.pill.combo svg{fill:#1b1402}
.iconbtn{border:0;background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvl{display:flex;align-items:center;gap:14px;margin-top:18px}
.hex{flex:none;position:relative;width:58px;height:64px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;color:#1b1402}
.hex svg{position:absolute;inset:0;width:100%;height:100%;fill:var(--amber)}
.hex span{position:relative}
.lvlname{font-weight:700;font-size:17px;margin-bottom:6px}
.xpbar{height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.goal .xpbar{background:var(--line)}
.goal b{font-size:17px}
.next{border:2px solid var(--amber)}
.next .lbl{font-weight:700;font-size:17px;margin-bottom:2px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;opacity:.55}
.bd .medal{background:var(--line);color:var(--mute);box-shadow:none;margin-bottom:4px}
.bd b{font-size:14.5px;line-height:1.2}
.bd small{font-size:12.5px;color:var(--mute);line-height:1.3}
.bd.on{opacity:1;border-color:var(--amber)}
.bd.on .medal{background:var(--amber);color:#1b1402;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.clr{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:#1b1402;background:var(--amber);padding:1px 8px;border-radius:99px;vertical-align:1px}
.stars{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.stars svg{width:44px;height:44px;fill:rgba(255,255,255,.18)}
.stars svg.on{fill:var(--amber);animation:starin .55s cubic-bezier(.2,1.3,.4,1) both}
.rstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.rstats b{display:block;font-size:22px}
.rstats span{font-size:12.5px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.opt.pop,.opt.shake,.expl,.face.flipin,.ring.intro .tk,.stars svg.on,.toast,.xpfloat{animation:none!important}}

/* ===== A (1-6) ===== */
Q(1,"Which statement best defines biotechnology?","Using living organisms or their molecules to make products or solve problems","Using chemical reactions to manufacture synthetic medicines in sterile labs","Studying how traits are passed from one generation to the next","Using computer models to predict how living systems behave","Biotechnology puts living things (microbes, cells, enzymes, DNA) to work for medicine, food, agriculture, and industry.");
Q(1,"Brewing beer, baking bread, and making insulin in bacteria all count as biotechnology because...","each puts living cells or their products to work for a human purpose","each changes the DNA sequence of the organism that is used","each requires sterile conditions and specialized lab equipment","each ends with a protein that could be used as a medicine","The shared idea is using living things for a purpose. Only the insulin example involves changing DNA.");
Q(2,"Which statement is true of BOTH traditional and modern biotechnology?","They both use living organisms or their products to make something useful","They both insert specific genes into the organism being used","They both depend on knowing the organism's DNA sequence","They both need equipment such as a thermal cycler","Similarity: both harness living things. Direct gene manipulation is only part of modern biotech.");
Q(2,"What most separates modern biotechnology from traditional biotechnology?","Modern methods change specific genes on purpose; traditional ones do not","Modern methods use living cells; traditional ones use only chemicals","Modern methods work on single cells; traditional ones on whole organisms","Modern methods are used in medicine; traditional ones only in food","Traditional: fermentation and breeding. Modern: genetic engineering, recombinant DNA, PCR.");
Q(3,"Which is an example of TRADITIONAL biotechnology?","Making yogurt by letting bacteria ferment milk","Making human insulin in bacteria that carry the human gene","Making bacteria glow by adding a jellyfish gene","Copying a DNA fragment millions of times with PCR","Fermentation predates any knowledge of DNA. The other three directly manipulate DNA.");
Q(3,"Which is an example of MODERN biotechnology?","Making human insulin in bacteria that carry the human gene","Making bread rise with baker's yeast","Making wine by fermenting grape juice","Breeding the highest-yielding cows over many generations","Moving a human gene into bacteria is genetic engineering.");
Q(3,"Selective breeding of crops over many generations is...","traditional biotechnology","genetic engineering","modern biotechnology","not biotechnology","It uses living organisms to get a useful result, but genes are not directly manipulated, so it is traditional.");
Q(4,"What is genetic engineering?","Directly changing an organism's DNA, often by adding a gene","Choosing parents with desirable traits to breed together","Using microbes to ferment raw materials into new products","Sequencing an organism's DNA to read its genes","Genetic engineering is deliberate, direct change to an organism's genome.");
Q(4,"Which is an example of genetic engineering?","Adding the GFP gene to E. coli with the pGLO plasmid","Growing E. coli on LB agar to form colonies","Staining E. coli so it can be viewed under a microscope","Picking the E. coli colonies that grow fastest","Only pGLO transformation changes the genome (adds a gene).");
Q(5,"A person who checks each batch of a product against purity specifications works as a...","quality control analyst","regulatory affairs specialist","bioprocess engineer","research associate","QC analysts run assays on batches before release. Regulatory affairs handles agency paperwork; bioprocess engineers scale up production.");
Q(5,"Who uses computers and statistics to analyze DNA sequence data?","A bioinformatician","A genetic counselor","A bioprocess engineer","A quality control analyst","Bioinformatics combines biology with computing.");
Q(6,"Which job typically requires the MOST advanced degree?","Principal investigator running an independent research lab","Research associate carrying out experiments","Quality control analyst testing products","Manufacturing technician running equipment","Leading independent research generally requires a doctorate (PhD/MD).");
Q(6,"Which degree and job pairing is the most typical?","Master's degree: genetic counselor","Associate degree: genetic counselor","Bachelor's degree: principal investigator","Certificate: director of research","Genetic counseling is a master's-level career. Lead research roles need a doctorate.");

/* ===== B (7-15) ===== */
Q(7,"What does an SDS contain?","Hazards, handling, first aid, and disposal details for one chemical","Step-by-step instructions for running a lab procedure","Calibration and maintenance steps for lab equipment","A list of every chemical in the lab and where it is stored","The SDS (formerly MSDS) is the safety reference for a specific chemical.");
Q(7,"Which document gives the first-aid, spill, and disposal steps for a specific chemical?","Its SDS","The lab protocol handout","The chemical inventory list","Your lab notebook","The SDS is chemical-specific. A protocol covers the procedure, not the chemical's hazards.");
Q(8,"You are pouring a liquid that could splash toward your face. Which PPE protects your eyes best?","Splash goggles","Nitrile gloves","A lab coat","Closed-toe shoes","Goggles seal around the eyes. The other items protect other body parts.");
Q(8,"You are viewing plates under a UV lamp. Which PPE do you need most?","UV-blocking goggles","Heat-resistant gloves","A splash apron","A respirator mask","UV light damages eyes and skin, so use UV-blocking eyewear (or a face shield). Heat gloves are for hot items.");
Q(8,"Which of these is NOT personal protective equipment?","A fume hood","A face shield","A lab coat","Nitrile gloves","A fume hood is an engineering control that vents vapors. PPE is worn on the body.");
Q(9,"Which would be an acceptable label on a prepared solution?","1 M NaCl, made 10/3, initials CL","Salt water, Period 3","NaCl, 10/3","1 M, initials CL","A good label has the contents, concentration, date made, and who made it. Each wrong option is missing at least one.");
Q(10,"Which tool would you use to pull a precipitate to the bottom of a 1.5 mL tube?","Microcentrifuge","Vortex","Thermal cycler","Gel electrophoresis apparatus","A microcentrifuge spins small tubes to pellet material. A vortex mixes.");
Q(10,"You need to move 7 µL of DNA into a tube. Which tool?","Micropipette","Serological pipette","Graduated cylinder","Dropper bottle","Micropipettes handle microliter volumes. Serological pipettes handle mL volumes.");
Q(10,"You need to measure 10 mL of buffer accurately. Which is most appropriate?","A serological pipette","A P-1000 micropipette","A P-100 micropipette","A plastic transfer pipette","P-1000 tops out at 1 mL. Serological pipettes are graduated for mL volumes; transfer pipettes are not accurate.");
Q(10,"What does a spectrophotometer measure?","How much light a sample absorbs or transmits","How fast molecules move through a gel","The hydrogen ion concentration of a sample","The mass of a sample per unit volume","Absorbance relates to concentration of DNA, protein, or cells.");
Q(10,"A mixture of DNA fragments needs to be separated by size. Which setup do you use?","Gel electrophoresis apparatus","Thermal cycler","Microcentrifuge","Spectrophotometer","Electric current pulls DNA through a gel; smaller fragments travel farther.");
Q(10,"Which tool mixes the contents of a tube by rapid shaking?","Vortex","Microcentrifuge","Picofuge","Thermal cycler","A vortex swirls the liquid. Centrifuges spin to separate.");
Q(10,"Which instrument repeatedly heats and cools samples to copy a DNA sequence?","Thermal cycler (PCR machine)","Gel electrophoresis apparatus","Spectrophotometer","Vortex","PCR cycles denaturing, annealing, and extension temperatures.");
Q(11,"How does a picofuge differ from a microcentrifuge?","It is a small quick-spin unit that mainly gathers liquid at the bottom of tubes","It reaches higher speeds so it can pellet cells and debris","It holds large tubes of 15 to 50 mL","It cools samples while they spin","A picofuge is a compact low-speed 'quick spin'. Where each is kept in your lab goes in your notes.");
Q(11,"Which statement about micropipette tips is true?","A fresh tip is used for each sample","A tip can be reused if rinsed with water between samples","One tip size works for any micropipette","Tips are only needed for thick liquids","Reusing tips cross-contaminates samples, and each pipette needs the tip size made for it.");
Q(12,"Where is the plunger when you lower the tip into the liquid to draw up a sample?","At the first stop","At the second stop","Fully released","Halfway between the two stops","Press to the first stop, submerge the tip, then release slowly.");
Q(12,"What is the purpose of the second stop on a micropipette?","It pushes out the last bit of liquid when dispensing","It draws up extra volume to prevent air bubbles","It locks the volume setting","It ejects the tip","The second stop blows out the remaining drop. A separate button ejects the tip.");
Q(12,"Which is correct micropipette technique?","Release the plunger slowly to draw liquid in smoothly","Release the plunger quickly to pull liquid in faster","Lay the pipette flat to keep the liquid from dripping","Dial slightly past the range to be safe","Fast release can create bubbles and inaccurate volumes. Never exceed the range or lay a loaded pipette down.");
Q(13,"The dial of a P-10 reads 055. What volume is set?","5.5 µL","55 µL","550 µL","0.55 µL","P-10 digits read XX.X µL, so 055 is 05.5 µL.");
Q(13,"The dial of a P-100 reads 055. What volume is set?","55 µL","5.5 µL","550 µL","0.55 µL","P-100 digits read whole microliters.");
Q(13,"The dial of a P-1000 reads 055. What volume is set?","550 µL","55 µL","5.5 µL","5500 µL","On a P-1000 each unit on the last digit is 10 µL, so 055 = 550 µL = 0.55 mL.");
Q(14,"A P-10 is set to 089. How much is pipetted?","8.9 µL (0.0089 mL)","89 µL (0.089 mL)","890 µL (0.89 mL)","0.89 µL (0.00089 mL)","P-10 reads XX.X, so 08.9 µL. Divide by 1000 for mL.");
Q(14,"A P-100 is set to 089. How much is pipetted?","89 µL (0.089 mL)","8.9 µL (0.0089 mL)","890 µL (0.89 mL)","0.89 µL (0.00089 mL)","P-100 reads whole microliters: 89 µL = 0.089 mL.");
Q(14,"A P-1000 is set to 089. How much is pipetted?","890 µL (0.89 mL)","89 µL (0.089 mL)","8.9 µL (0.0089 mL)","8900 µL (8.9 mL)","P-1000 digits are 10s of µL: 089 = 890 µL = 0.89 mL.");
Q(15,"You have only one sample to spin in a microcentrifuge. What do you do?","Add a tube with an equal volume of water directly opposite","Place it in any slot and close the lid","Spin it at a lower speed to compensate","Place an empty tube opposite it","An unbalanced rotor can damage the machine. Use a balance tube of equal volume.");
Q(15,"Which setup is balanced?","Two tubes with equal volumes in opposite slots","Two tubes with equal volumes in neighboring slots","Two tubes in opposite slots holding 1.5 mL and 0.5 mL","Two tubes with equal volumes, one slot apart","Equal mass has to be placed directly across the rotor from each other.");

/* ===== C (16-21) ===== */
Q(16,"Milk is curdled by adding lemon juice and warming it. Which cheese-making method is this?","Direct acid coagulation","Bacterial starter culture","Animal rennet","Recombinant chymosin","Acid lowers pH so casein clumps; no enzyme or microbe is needed.");
Q(16,"Lactococcus bacteria are added to warm milk and left to ferment. Which method is this?","Bacterial starter culture","Direct acid coagulation","Animal rennet","Recombinant chymosin","The bacteria make lactic acid from lactose, which lowers the pH.");
Q(16,"Chymosin is extracted from the stomach lining of young calves. Which method is this?","Animal rennet","Direct acid coagulation","Bacterial starter culture","Recombinant chymosin","Traditional rennet comes from calf stomachs.");
Q(16,"How is recombinant chymosin produced?","Microbes carrying the calf chymosin gene make it in fermenters","The lining of a calf stomach is dried and extracted","Bacteria ferment lactose into it","Chemists synthesize it from milk sugar","The chymosin gene is cloned into bacteria, yeast, or mold; this is genetic engineering.");
Q(16,"Which pair of methods clots milk using the enzyme chymosin?","Animal rennet and recombinant chymosin","Direct acid and starter culture","Animal rennet and starter culture","Direct acid and recombinant chymosin","Acid and starter culture work by lowering pH, not by an enzyme.");
Q(16,"Why is recombinant chymosin more consistent than animal rennet?","It is a single purified enzyme, not a variable animal extract","It contains several enzymes that speed aging of the cheese","It clots milk by lowering pH instead of cutting casein","It is made from lactose rather than from protein","Microbes make identical enzyme every batch, with no calves needed.");
Q(17,"Which milk component forms the curd?","Casein","Lactose","Lactic acid","Whey","Casein proteins clump into curd; lactose stays dissolved in whey.");
Q(17,"Casein is best described as...","the main protein in milk","the main sugar in milk","an enzyme that clots milk","the liquid left after curdling","About 80% of milk protein is casein.");
Q(18,"Which bonds does a protease cut?","Peptide bonds","Phosphodiester bonds","Hydrogen bonds between bases","Glycosidic bonds","Proteases break proteins apart at peptide bonds.");
Q(18,"How does chymosin help form curds?","It cuts casein so the proteins clump together","It converts lactose into lactic acid","It raises the pH until casein precipitates","It digests the milk fat so casein separates","Chymosin is a protease that removes casein's stabilizing region.");
Q(19,"What activity produces lactic acid in starter-culture cheese-making?","Bacteria fermenting lactose","Yeast fermenting glucose","Bacteria digesting casein","Enzymes cutting butterfat","Lactic acid bacteria ferment milk sugar into lactic acid.");
Q(19,"What does lactic acid do to the milk?","Lowers the pH so casein clumps","Raises the pH so casein dissolves","Digests casein into amino acids","Cuts casein the way chymosin does","Acidity destabilizes casein; it is not an enzymatic cut.");
Q(20,"After milk curdles, which statement is correct?","Curd is the solid casein; whey is the liquid that remains","Whey is the solid casein; curd is the liquid that remains","Curd and whey are both solids, made of different proteins","Curd and whey are both liquids that separate by density","The curd is pressed into cheese; the whey is drained off.");
Q(20,"Which is found mostly in whey?","Water and dissolved lactose","Aggregated casein","Clumped milk fat","Insoluble starch","Whey is the watery liquid left after curds form.");

Q(71,"A codon is...","three nucleotides on mRNA that specify an amino acid or a stop","three nucleotides on tRNA that pair with mRNA","three amino acids joined by peptide bonds","the start signal of a gene","Codons are read in groups of three.");

Q(71,"Which tRNA anticodon pairs with the mRNA codon 5'-GAU-3'?","3'-CUA-5'","3'-GAU-5'","3'-CTA-5'","5'-CUA-3'","G-C, A-U, U-A, and antiparallel gives 3'-CUA-5'. No T in RNA.");
Q(72,"What is the first codon in almost every mRNA, and what does it code for?","AUG; methionine","AUG; leucine","UAC; methionine","UAA; methionine","AUG is the start codon and codes for Met.");
Q(72,"Translation begins when the ribosome...","finds the first AUG in the mRNA","reaches the poly-A tail","binds the promoter","finds the TATA box","The start codon sets the reading frame.");
Q(73,"An ORF is...","a stretch of codons from a start codon to a stop codon","a promoter region upstream of a gene","a stretch of introns removed by splicing","a gap between Okazaki fragments","It can be translated into a protein.");
Q(73,"Which mRNA contains a complete ORF?","5'-AUGGCUUAA-3'","5'-UAAGCUAUG-3'","5'-GCUGCUGCU-3'","5'-AUGGCUGCU-3'","It needs an AUG start followed by in-frame codons and a stop (UAA).");
Q(74,"What happens at INITIATION?","The small subunit binds mRNA at the start codon, then the large subunit joins","A release factor binds the stop codon","tRNAs add amino acids one by one","The polypeptide folds","Initiation assembles the ribosome at AUG.");
Q(74,"What happens during ELONGATION?","tRNAs deliver amino acids and peptide bonds form","The small subunit scans for AUG","A release factor enters the ribosome","The ribosome splits into subunits","The ribosome moves codon by codon.");
Q(74,"What triggers TERMINATION?","A stop codon with a release factor","A start codon with an initiator tRNA","The poly-A tail leaving the ribosome","The last tRNA leaving","No tRNA matches a stop codon.");
Q(75,"What is the ribosome's job?","Read codons and join amino acids","Carry amino acids to the mRNA","Unwind DNA","Splice mRNA","Ribosomes read mRNA and make peptide bonds.");
Q(75,"What does the small ribosomal subunit do?","Binds the mRNA and positions the start codon","Catalyzes peptide bonds","Releases the finished polypeptide","Carries the anticodon","The large subunit catalyzes peptide bonds.");
Q(75,"A peptide bond joins...","two amino acids","two nucleotides","a base to a sugar","two DNA strands","Peptide bonds form the polypeptide backbone.");
Q(75,"At a stop codon, no tRNA matches, so ___ enters the ribosome.","a release factor","a second initiator tRNA","DNA polymerase","a ligase","The release factor ends translation.");
Q(75,"A polypeptide becomes a functional protein by...","folding into its 3D shape","being spliced","being capped","being transcribed","Folding gives the protein its function.");
Q(76,"For the Q76 strands, which is the TEMPLATE strand? Top: 5'-ATGGATCTGAATTGA-3', Bottom: 3'-TACCTAGACTTAACT-5'","The bottom strand","The top strand","Either strand gives the same mRNA","Both strands are read in turn","The top strand reads ATG...TGA, so it is the coding strand. The bottom strand is the template.");
Q(76,"What mRNA is made from the template 3'-TACCTAGACTTAACT-5'?","5'-AUGGAUCUGAAUUGA-3'","5'-UACCUAGACUUAACU-3'","5'-AGUUAAGUCUAGGUA-3'","5'-ATGGATCTGAATTGA-3'","Complement each base (A-U, T-A, C-G, G-C) and write 5' to 3'.");
Q(76,"What are the codons of the Q76 mRNA, 5'-AUGGAUCUGAAUUGA-3'?","AUG, GAU, CUG, AAU, UGA","AUG, GAU, CUG, AAU, UAA","UAC, CUA, GAC, UUA, ACU","AUGG, AUC, UGA, AUU, GA","Read in groups of three from the start.");
Q(76,"Which tRNA anticodons match the first four codons (AUG, GAU, CUG, AAU)?","3'-UAC-5', 3'-CUA-5', 3'-GAC-5', 3'-UUA-5'","3'-TAC-5', 3'-CTA-5', 3'-GAC-5', 3'-TTA-5'","3'-AUG-5', 3'-GAU-5', 3'-CUG-5', 3'-AAU-5'","5'-UAC-3', 5'-CUA-3', 5'-GAC-3', 5'-UUA-3'","Anticodons are complementary, RNA (U not T), and antiparallel. Written 5'→3' they would be CAU, AUC, CAG, AUU.");
Q(76,"Which amino acids does the Q76 mRNA code for, in order?","Met - Asp - Leu - Asn","Met - Glu - Leu - Asn","Met - Asp - Val - Asn","Met - Asp - Leu - Asn - Trp","AUG Met, GAU Asp, CUG Leu, AAU Asn, UGA stop. Trp is UGG, not UGA.");
Q(76,"In Q76, what is the last codon, UGA?","A stop codon; a release factor binds and no amino acid is added","A codon for tryptophan; tRNA-Trp binds","A second start codon; translation begins again","A codon for leucine; a tRNA adds Leu","UGA does not code for an amino acid.");

/* ===== K (77-78) ===== */
Q(77,"Activators are...","proteins that bind enhancers and increase transcription","proteins that bind promoters and block RNA polymerase","enzymes that splice introns","RNAs that carry amino acids","Activators help recruit RNA polymerase. Proteins that block it are repressors.");
Q(77,"Enhancers are...","DNA sequences, often far from the gene, that bind activators","DNA sequences at the start codon that bind ribosomes","proteins that open the DNA","short RNAs that boost translation","Enhancers act through activators.");
Q(77,"How can an enhancer far from a gene still affect it?","DNA loops so bound activators contact the promoter machinery","Activators travel through the cytoplasm to the ribosome","The enhancer is copied into the mRNA first","Ligase moves the enhancer next to the gene","Looping brings distant DNA close together.");
Q(78,"The TATA box is...","a promoter element about 25-30 bp upstream that helps position RNA polymerase","a sequence at the end of a gene that stops transcription","a splice site in pre-mRNA","a start codon for translation","It helps transcription start at the right place.");
Q(78,"The CAAT box is...","a promoter element farther upstream that boosts transcription efficiency","a sequence at the end of a gene that stops transcription","a ribosome-binding site on mRNA","an element that adds the poly-A tail","CAAT boxes affect how often a gene is transcribed.");
Q(78,"Where are TATA and CAAT boxes found?","The promoter region of eukaryotic genes","The 3' end of mRNA","Inside introns","On the ribosome","They are bound by transcription factors.");

/* ===== L (79-82) ===== */
Q(79,"Chromatin is...","DNA wrapped around histones in uncondensed form","a gene's coding region","RNA bound to ribosomes","the fully condensed form seen in mitosis","Chromatin condenses further to form chromosomes.");
Q(79,"Which statement correctly relates DNA, chromatin, chromosomes, and genes?","Genes are DNA segments; DNA plus histones is chromatin; chromatin condenses into chromosomes","Chromosomes are segments of genes; genes are made of chromatin","DNA is a segment of a gene packaged inside chromatin","Chromatin is made of genes; chromosomes are chromatin plus RNA","Genes are functional segments of DNA located on chromosomes.");
Q(79,"A gene is...","a DNA segment coding for a protein or functional RNA","a protein that packages DNA","a fully condensed DNA-protein structure","one complete set of chromosomes","Genes are units of heredity.");
Q(80,"Does a liver cell contain the same chromosomes as a cheek cell?","Yes; both came from one zygote by mitosis","No; liver cells lose the genes they do not use","Yes; but only the active genes are present","No; each tissue has chromosomes suited to its function","Cells differ in which genes are expressed, not which genes they have.");
Q(80,"Why do liver and cheek cells function differently?","They express different genes","They contain different genes","They use different DNA bases","They have different numbers of chromosomes","Differential gene expression.");
Q(81,"In the crude DNA extraction lab, what makes DNA insoluble?","Cold alcohol","Detergent","Protease","Hot water","DNA dissolves in water but precipitates in cold ethanol or isopropanol.");
Q(81,"What does salt do in DNA extraction?","Neutralizes DNA's negative charge so strands clump in alcohol","Breaks down the cell membrane","Digests histones","Keeps DNA dissolved so it can be pipetted","Salt helps DNA precipitate.");
Q(82,"What does the lysis buffer (soap) do?","Breaks down cell and nuclear membranes","Digests proteins bound to DNA","Makes DNA insoluble","Neutralizes DNA's charge","Detergent dissolves lipids in membranes.");
Q(82,"What does the protease do?","Digests proteins such as histones so DNA is freed","Dissolves lipid membranes","Precipitates DNA","Cuts DNA into smaller pieces","Removing protein gives cleaner DNA.");
Q(82,"Which order is correct for the crude DNA extraction?","Lyse cells, add protease, add cold alcohol","Add cold alcohol, lyse cells, add protease","Add protease, add cold alcohol, lyse cells","Add cold alcohol, add protease, lyse cells","Release the DNA, clean away proteins, then precipitate.");
C(1,"What is biotechnology?","The use of living organisms, cells, or their molecules (DNA, proteins, enzymes) to make products or solve problems, in areas like medicine, food, agriculture, and industry.");
C(2,"Traditional vs modern biotechnology: similar and different?","SIMILAR: both use living things to make useful products.\nDIFFERENT: traditional = natural processes/breeding, genes not directly manipulated. Modern = directly manipulates DNA/genes (genetic engineering, recombinant DNA).");
C(3,"Examples: traditional vs modern biotech","TRADITIONAL: bread, beer, wine, yogurt, cheese, selective breeding.\nMODERN: genetically engineered insulin, pGLO/GFP bacteria, PCR, GMO crops, gene therapy.");
C(4,"What is genetic engineering?","Directly changing an organism's DNA, often by inserting a gene (from the same or another species) so the organism makes a new protein or trait.");
C(5,"Biotech career options","Research scientist, lab technician, QC/QA analyst, manufacturing/bioprocess technician, bioinformatician, genetic counselor, forensic scientist, regulatory affairs, biomedical engineer.");
C(6,"Biotech jobs by degree","Certificate/associate: lab or manufacturing technician.\nBachelor's: research associate, QC/QA analyst.\nMaster's: senior scientist, genetic counselor.\nPhD/MD: principal investigator, R&D director, professor.");
C(7,"What is an MSDS/SDS?","Material Safety Data Sheet (now Safety Data Sheet). A document for each chemical listing hazards, safe handling and storage, PPE, first aid, spill and disposal procedures.");
C(8,"PPE: what it is + examples by hazard","Personal Protective Equipment, worn to protect you.\nChemical splash: goggles. Skin contact: gloves. Clothing/body: lab coat. Hot items: heat gloves. UV: UV-blocking goggles/face shield. Always: closed-toe shoes, long hair tied back.");
C(9,"How to label a solution","Name/contents, concentration, date prepared, your initials, and hazard warnings if any.");
C(10,"Equipment uses: microcentrifuge, micropipette, serological pipette, spectrophotometer","Microcentrifuge: spins small tubes to pellet or collect.\nMicropipette: measures/transfers microliters.\nSerological pipette: measures/transfers mL volumes.\nSpectrophotometer: measures absorbance of light.");
C(10,"Equipment uses: gel electrophoresis, vortex, thermal cycler","Gel electrophoresis apparatus: separates DNA/RNA/proteins by size with electric current.\nVortex: mixes a tube by vibration.\nThermal cycler (PCR): cycles temperatures to amplify DNA.");
C(11,"Where are the picofuge, microcentrifuge, micropipettes, tips, and microtubes kept?","These are specific to your classroom. Open Coverage and write where each item is kept in your notes for topic 11.");
C(12,"Steps to use a micropipette","1) Choose the right pipette and set volume within range.\n2) Attach a tip firmly.\n3) Press to first stop.\n4) Insert tip below the liquid surface, release slowly.\n5) Move to target tube.\n6) Dispense: press to first then second stop.\n7) Eject tip. Keep pipette upright with liquid in the tip.");
C(13,"How to read P-10 / P-100 / P-1000","Three-digit dial, read top to bottom.\nP-10 (about 0.5-10 µL): XX.X µL (last digit = tenths)\nP-100 (10-100 µL): XXX µL\nP-1000 (100-1000 µL): X.XX mL, i.e., each last digit is 10 µL.");
C(14,"Dial 089 on each pipette","P-10: 8.9 µL = 0.0089 mL\nP-100: 89 µL = 0.089 mL\nP-1000: 890 µL = 0.89 mL\n(1000 µL = 1 mL)");
C(15,"How to balance a microcentrifuge","Put tubes directly across from each other (opposite positions) with equal volumes/weights. Odd number of samples? Use a balance tube with the same volume of water. Close the lid before spinning.");
C(16,"Four ways cheese can be made (check against class notes)","1) Direct ACID (vinegar/lemon juice + heat): low pH clumps casein.\n2) STARTER CULTURE: bacteria ferment lactose to lactic acid.\n3) Animal RENNET: chymosin (a protease) from calf stomach cuts casein.\n4) RECOMBINANT chymosin: gene put in microbes that mass-produce chymosin (modern biotech).");
C(17,"Casein","The main protein in milk. Clumps into curds when acidified or cut by chymosin.");
C(18,"Proteases","Enzymes that break down proteins by cutting peptide bonds. Chymosin (rennet) is a protease used for cheese.");
C(19,"How lactic acid forms in cheese-making","Lactic acid bacteria (starter culture) ferment lactose into lactic acid. The pH drops and casein clumps into curds.");
C(20,"Curd and whey","CURD: solid clumps of casein (become cheese).\nWHEY: liquid left behind (water, lactose, some proteins).");
C(21,"Calibrating a pH meter and an electronic balance","pH meter: rinse probe, place in standard buffers of known pH (e.g., 4, 7, 10), calibrate, rinse with distilled water between buffers.\nBalance: level it, clean pan, tare container, check with calibration weight.");
C(22,"Prokaryotic vs eukaryotic cells","PROKARYOTE: no nucleus (DNA in nucleoid), no membrane-bound organelles, small, circular DNA, plasmids, unicellular (bacteria).\nEUKARYOTE: nucleus, membrane-bound organelles, larger, linear chromosomes, uni- or multicellular.");
C(23,"Organelle functions (1/2)","Nucleus: stores DNA, controls cell.\nER: makes/transports proteins (rough) and lipids (smooth).\nGolgi: modifies, sorts, packages proteins.\nPlasma membrane: controls what enters/leaves.\nCell wall: rigid support/protection.");
C(23,"Organelle functions (2/2)","Vacuole: stores water, nutrients, waste.\nMitochondria: makes ATP (cell respiration).\nChloroplast: photosynthesis.\nLysosome: digests waste and worn-out organelles.");
C(24,"Animal vs plant cells","PLANT only: cell wall, chloroplasts, large central vacuole.\nANIMAL: lysosomes, small vacuoles, no cell wall or chloroplasts. Both have nucleus, mitochondria, ER, Golgi, plasma membrane.");
C(25,"Nucleosome","DNA wrapped around a core of histone proteins ('beads on a string'). The first level of DNA packaging.");
C(26,"Histones","Positively charged proteins that DNA wraps around to form nucleosomes. They package DNA and help regulate gene access.");
C(27,"Central dogma","DNA → RNA → protein.\nTranscription: DNA → mRNA. Translation: mRNA → protein. (DNA also copies itself: replication.)");
C(28,"Purpose of replication, transcription, translation","Replication: copy DNA before cell division.\nTranscription: make RNA copy of a gene.\nTranslation: make a protein from mRNA.");
C(29,"Three components of a nucleotide","Phosphate group + 5-carbon sugar (deoxyribose in DNA, ribose in RNA) + nitrogenous base.");
C(30,"Purines vs pyrimidines","PURINES: two rings (A, G).\nPYRIMIDINES: one ring (C, T, U).");
C(31,"Which bases are which?","Purines: Adenine, Guanine ('Pure As Gold').\nPyrimidines: Cytosine, Thymine, Uracil ('CUT the Py').");
C(32,"Structure of DNA (what to draw)","Two strands forming a double helix. Each nucleotide: deoxyribose (sugar) + phosphate + nitrogenous base. Backbone = sugar-phosphate. Bases pair in the middle (A=T, G≡C). One strand runs 5' to 3', the other 3' to 5'. 5' end: free phosphate. 3' end: free OH.");
C(33,"How nucleotides are linked","Along a strand: phosphodiester bonds (covalent, sugar to phosphate).\nBetween strands: hydrogen bonds between bases.");
C(34,"Base pairing rules","A pairs with T (2 H-bonds). G pairs with C (3 H-bonds). In RNA, A pairs with U.");
C(35,"Purpose of DNA replication","Copy the genome so each new cell gets a complete set of DNA (occurs before cell division).");
C(36,"Purpose of mitosis","Produces two genetically identical daughter cells for growth, repair, and replacement of cells.");
C(37,"Chromosome, centromere, chromatid","CHROMOSOME: long DNA molecule packaged with proteins.\nCHROMATIDS: two identical copies of a replicated chromosome.\nCENTROMERE: region joining sister chromatids.");
C(38,"Complementary, antiparallel, semiconservative","COMPLEMENTARY: bases pair A-T, G-C.\nANTIPARALLEL: strands run opposite directions (5'→3' and 3'→5').\nSEMICONSERVATIVE: each new DNA has one old and one new strand.");
C(39,"Replication proteins (1/2)","Helicase: unwinds/unzips DNA (breaks H-bonds).\nGyrase/topoisomerase: relieve twisting strain ahead of fork.\nReplication fork: Y-shaped region of unwinding.\nDNA binding proteins: keep strands apart.");
C(39,"Replication proteins (2/2)","Primase: makes RNA primer.\nDNA polymerase: adds nucleotides to 3' end.\nLeading strand: continuous.\nLagging strand: Okazaki fragments (discontinuous).\nLigase: seals fragments together.");
C(40,"Direction DNA polymerase READS","Reads the template strand 3' to 5'.");
C(41,"Direction DNA polymerase BUILDS","Builds the new strand 5' to 3' (adds to the 3' end).");
C(42,"Plasmid","Small circular extra-chromosomal DNA in bacteria that replicates independently and often carries useful genes.");
C(43,"Why a plasmid is a vector","A vector carries foreign DNA into a host cell. Plasmids can carry a gene (like GFP) into bacteria.");
C(44,"ORI (origin of replication)","Starting point for copying the plasmid, so it can replicate in the host cell.");
C(45,"Selective marker; pGLO's marker","Selective marker: gene that lets you select for cells that took up the plasmid (e.g., antibiotic resistance).\npGLO: bla gene (beta-lactamase) = ampicillin resistance.");
C(46,"Competent cells: meaning and two methods","Competent = able to take up foreign DNA.\nMethods: (1) chemical: CaCl2 + heat shock, (2) electroporation (electric pulse).");
C(47,"Genetic transformation","A cell takes up foreign DNA and expresses its gene(s), changing the cell's traits.");
C(48,"pGLO parts and functions","GFP gene: makes green fluorescent protein.\nbla gene: ampicillin resistance (selective marker).\naraC gene: makes araC protein (regulator).\nPromoter (pBAD/operon): where RNA polymerase binds and araC acts.\nORI: lets plasmid replicate.");
C(49,"Steps of genetic transformation (pGLO)","1) Suspend cells in cold CaCl2.\n2) Add pGLO DNA, keep on ice.\n3) Heat shock (42°C, about 50 s).\n4) Back on ice.\n5) Add LB broth, recover.\n6) Plate on LB, LB/amp, LB/amp/ara.\n7) Incubate 24-48 h.");
C(50,"Function of CaCl2, heat shock, and LB","CaCl2: Ca2+ neutralizes negative charges on DNA and membrane so DNA can approach.\nHeat shock: temperature imbalance helps DNA enter the cell.\nLB: nutrients so cells recover and express the new genes.");
C(51,"Arabinose","A sugar that acts as the inducer of the GFP gene in pGLO. It turns GFP ON.");
C(52,"How GFP is turned ON or OFF (pGLO)","OFF (no arabinose): araC protein binds the promoter/operon and blocks RNA polymerase.\nON (arabinose present): arabinose binds araC protein, it lets go, RNA polymerase binds the promoter and transcribes the GFP gene, mRNA is translated to GFP.");
C(53,"Media used in pGLO lab","LB (no antibiotic), LB/amp (ampicillin), LB/amp/ara (ampicillin plus arabinose).");
C(54,"Plate results and why","+pGLO LB/amp/ara: growth and glows (amp resistance, GFP ON).\n+pGLO LB/amp: growth, no glow (GFP OFF).\n-pGLO LB/amp: no growth (no resistance).\n-pGLO LB: lawn, no glow (no plasmid, no selection).");
C(55,"Chromatography in biotech","Separates and purifies molecules (e.g., proteins) from a mixture based on properties such as size, charge, or hydrophobicity.");
C(56,"Types of column chromatography","Size exclusion (gel filtration), ion exchange, affinity, hydrophobic interaction (HIC).\nClass used: HYDROPHOBIC INTERACTION chromatography.");
C(57,"Lysozyme","Enzyme that digests the peptidoglycan cell wall of bacteria, bursting them open so GFP is released.");
C(58,"GFP purification steps and buffers","1) Lyse bacteria with lysozyme.\n2) Spin to remove debris, keep supernatant.\n3) Add high-salt binding/equilibration buffer: GFP (hydrophobic) binds hydrophobic beads.\n4) Wash buffer (medium salt): removes hydrophilic proteins.\n5) Elution buffer (low salt): releases GFP.\nHydrophobic regions stick in high salt; hydrophilic proteins flow through.");
C(59,"Purpose of transcription","Make an RNA copy (mRNA) of a gene from DNA. Occurs in the nucleus (eukaryotes).");
C(60,"RNA vs DNA","RNA: single-stranded, ribose sugar, uracil (no thymine), several types.\nDNA: double-stranded, deoxyribose sugar, thymine.");
C(61,"Uracil","A pyrimidine (one ring). Found in RNA, NOT in DNA (pairs with adenine).");
C(62,"Deoxyribose vs ribose","Ribose has an OH on the 2' carbon. Deoxyribose has just H there (one less oxygen). Ribose: RNA. Deoxyribose: DNA.");
C(63,"What are tRNA, mRNA, rRNA?","Three types of RNA: transfer RNA, messenger RNA, ribosomal RNA.");
C(64,"Uses of tRNA, mRNA, rRNA","mRNA: carries the gene message (codons) to ribosome.\ntRNA: brings amino acids; anticodon matches codon.\nrRNA: part of ribosome; helps form peptide bonds.");
C(65,"Transcription terms","RNA polymerase: builds RNA from template.\nPromoter: where RNA polymerase binds.\nTemplate strand: read 3'→5' to make RNA.\nCoding strand: same sequence as mRNA (with T for U).\nRNA is built 5'→3'.");
C(66,"Introns and exons","INTRONS: intervening non-coding regions, removed.\nEXONS: expressed coding regions, kept and joined.");
C(67,"Splicing","The spliceosome removes introns and joins exons. It happens in the nucleus.");
C(68,"5' cap and poly-A tail","5' methyl guanosine cap: protects mRNA, helps export and ribosome binding.\nPoly-A tail (3' end): protects mRNA from degradation, helps export.");
C(69,"Purpose of translation","Use the mRNA code to build a polypeptide/protein at the ribosome.");
C(70,"Where translation takes place","At ribosomes (in the cytoplasm, free or attached to rough ER).");
C(71,"Codon vs anticodon","CODON: 3 nucleotides on mRNA (codes for an amino acid or stop).\nANTICODON: 3 nucleotides on tRNA, complementary to the codon.");
C(72,"First codon in almost every mRNA","AUG (start codon). It codes for methionine (Met).");
C(73,"ORF (open reading frame)","A run of codons starting at a start codon (AUG) and ending at a stop codon, with no stop in between, that can be translated into a protein.");
C(74,"Initiation, elongation, termination","INITIATION: small subunit + mRNA + initiator tRNA at AUG; large subunit joins.\nELONGATION: tRNAs bring amino acids, peptide bonds form, ribosome moves codon by codon.\nTERMINATION: stop codon; release factor; polypeptide released.");
C(75,"Translation terms","mRNA: message. Codon: 3-nt code. Anticodon: on tRNA. Ribosome: site of translation. Small subunit: binds mRNA. Large subunit: forms peptide bonds. tRNA: brings amino acid. Start codon: AUG. Amino acid: building block. Peptide bond: links amino acids. Polypeptide: chain. Protein: folded polypeptide. Release factor: ends translation at stop codon.");
C(76,"Q76: mRNA from template 3'-TACCTAGACTTAACT-5'","The bottom strand is the template; the top strand is the coding strand (ATG...TGA).\nmRNA: 5'-AUG GAU CUG AAU UGA-3'.");
C(76,"Q76: anticodons and amino acids","Codons: AUG | GAU | CUG | AAU | UGA\nAnticodons (3'→5'): UAC | CUA | GAC | UUA | none\nAmino acids: Met | Asp | Leu | Asn | STOP\nPolypeptide: Met-Asp-Leu-Asn");
C(77,"Activators and enhancers","ACTIVATORS: transcription-factor proteins that bind enhancers to increase transcription.\nENHANCERS: DNA sequences (can be far from the gene) that activators bind; they help recruit RNA polymerase.");
C(78,"CAAT and TATA boxes","Promoter elements in eukaryotic genes bound by transcription factors.\nTATA box: about 25-30 bp upstream; positions RNA polymerase.\nCAAT box: farther upstream; boosts transcription efficiency.");
C(79,"DNA vs chromatin vs chromosomes vs genes","DNA: the molecule.\nCHROMATIN: DNA wrapped around histones.\nCHROMOSOME: highly condensed chromatin.\nGENE: segment of DNA coding for a protein or RNA.");
C(80,"Liver cell vs cheek cell DNA","Same chromosomes and DNA (both came from one fertilized egg by mitosis). They differ because different genes are turned on (gene expression).");
C(81,"What makes DNA insoluble in the extraction lab?","Cold alcohol (ethanol or isopropanol). DNA is soluble in water but precipitates in alcohol (salt helps clump it).");
C(82,"Lysis buffer and protease (DNA extraction)","LYSIS BUFFER (detergent/soap + salt): breaks cell and nuclear membranes.\nPROTEASE: digests proteins (like histones) so DNA is released and cleaner.");

setC('c17',{f:"Four ways cheese can be made (your packet)",b:"1) CONTROL / no treatment: milk is left to age, exposed to air; natural bacteria in the milk do the work.\n2) STARTER CULTURE / buttermilk: known bacteria (Lactobacillus in buttermilk) make enzymes that curdle milk.\n3) RENNIN (RENNET): protease purified from calf stomach cells; cleaves casein into fragments that settle as curds. Not vegetarian. (asiago, most brie, most cheddar)\n4) GE CHYMOSIN: cow rennin gene put into fungus cells, which make the enzyme. (Jack, mozzarella, most Swiss)"});

setC('c41',{b:"ORIs: eukaryotes have MULTIPLE origins; prokaryotes have ONE.\nHelicase recognizes the origin and breaks H-bonds between A-T and C-G to unzip the helix.\nDNA binding proteins hold the strands apart and stop H-bonds reforming.\nGyrase/topoisomerase: relieve twisting strain ahead of the fork.\nReplication fork: Y-shaped region of unwinding."});
setC('c42',{b:"Primase (an RNA polymerase) lays down an RNA primer; the primer provides a free 3' OH so a phosphodiester bond can form with the next nucleotide.\nDNA polymerase (Pol III and Pol I) extends from the primer 5'→3', and also replaces RNA primers with DNA.\nLeading strand: follows helicase, continuous.\nLagging strand: waits for the fork to open, so Okazaki fragments.\nLigase: seals the nicks in the backbone between fragments."});

const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],raf=0;
function confetti(n,power){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const d=window.devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;power=power||1;
  const cols=['#f2a51a','#ffd166','#ffffff','#4f86f7','#2fbf8f','#8fb4ff'];
  for(let i=0;i<(n||100);i++)parts.push({x:fx.width/2+(Math.random()-.5)*fx.width*.35,y:fx.height*.38,vx:(Math.random()-.5)*15*d*power,vy:(-Math.random()*15-4)*d*power,g:.42*d,s:(5+Math.random()*6)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0});
  if(!raf)raf=requestAnimationFrame(tickFx);
}
function tickFx(){
  fctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life<120&&p.y<fx.height+60);
  parts.forEach(p=>{p.life++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;
    fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;fctx.globalAlpha=Math.max(0,1-p.life/120);fctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);fctx.restore()});
  if(parts.length)raf=requestAnimationFrame(tickFx);else{raf=0;fctx.clearRect(0,0,fx.width,fx.height)}
}

/* ================= QUIZ RUNNER ================= */
let run=null;
function startRun(mode,qs,title){
  if(!qs.length){alert('Nothing to show here yet.');return}
  run={mode,title,i:0,combo:0,best:0,xp:0,lvUp:0,items:qs.map(q=>({q,ord:shuffle([0,1,2,3]),sel:null,done:false}))};
  go('run');
}
function buildExam(){
  const topics=shuffle(ALLN).slice(0,70),used=new Set(),out=[];
  topics.forEach(n=>{const pool=shuffle(mcqForTopic(n)).filter(q=>!used.has(q.id));
    if(pool.length){used.add(pool[0].id);out.push(pool[0])}});
  return shuffle(out);
}
function buildSweep(){
  const used=new Set(),out=[];
  shuffle(ALLN).forEach(n=>{
    const pool=shuffle(mcqForTopic(n)).filter(q=>!used.has(q.id));
    pool.sort((a,b)=>weight(b)-weight(a));
    if(pool.length){used.add(pool[0].id);out.push(pool[0])}});
  return out;
}
function weight(q){const s=S.q[q.id];if(!s||!s.seen)return 3+Math.random();if(isMissed(q))return 4+Math.random();return (1-(s.correct/(s.seen||1)))+Math.random()*.5}
function buildSmart(n){return MCQ.slice().sort((a,b)=>weight(b)-weight(a)).slice(0,n)}

VIEWS.run=function(){
  const it=run.items[run.i],q=it.q,n=run.items.length,exam=run.mode==='exam';
  const cl=qCluster(q);
  const opts=it.ord.map((oi,k)=>{
    let cls='opt';
    if(exam){if(it.sel===k)cls+=' sel'}
    else if(it.done){if(oi===0)cls+=' right'+(it.sel===k?' pop':'');else if(it.sel===k)cls+=' wrong shake';else cls+=' dim'}
    return `<button class="${cls}" data-opt="${k}"><span class="l">${LET[k]}</span><span>${esc(q.o[oi])}</span></button>`}).join('');
  let fb='',dock='';
  if(exam){
    const last=run.i===n-1;
    dock=`<div class="dock"><div class="btns">${run.i>0?'<button class="btn ghost" data-act="prev">Back</button>':''}<button class="btn ${it.sel===null?'ghost':'amber'}" data-act="${last?'finish':'next'}">${last?'Finish exam':'Next'}</button></div></div>`;
  }else if(it.done){
    const ok=q.o[it.ord[it.sel]]===q.o[0];
    fb=`<div class="expl ${ok?'ok':'no'}"><b class="v">${ok?(run.combo>=3?run.combo+' in a row':OKS[run.i%OKS.length]):NOS[run.i%NOS.length]}</b>${ok?'':'Correct answer: <b>'+esc(q.o[0])+'</b><br>'}${esc(q.e)}</div>`;
    dock=`<div class="dock"><button class="btn amber" data-act="${run.i===n-1?'finish':'next'}">${run.i===n-1?'See results':'Next question'}</button></div>`;
  }
  return `<div class="qtop"><button class="btn" data-act="exit">Exit</button><div class="grow">${run.i+1} / ${n}${run.combo>=2&&run.mode!=='exam'?'<span class="pill combo">'+FLAME+run.combo+'</span>':''}</div><span class="tag" style="background:rgba(255,255,255,.14);color:#fff;border:0">${cl.id} · Q${q.t.join(', ')}</span></div>
  <div class="prog"><i style="width:${Math.round(100*(run.i+(it.done?1:0))/n)}%"></i></div>
  <div class="pad"><div class="qtext">${esc(q.q)}</div>${opts}${fb}${dock}</div>`;
};
function finishRun(){
  const exam=run.mode==='exam',n=run.items.length;let score=0;
  run.items.forEach(it=>{const ok=it.sel!==null&&it.ord[it.sel]===0;if(ok)score++;if(exam)record(it.q.id,ok);it.ok=ok});
  run.score=score;const p=score/n;
  const prevBest=S.exams.length?Math.max(...S.exams.map(e=>e.score/e.total)):0;
  if(exam){activity(n);S.exams.push({t:Date.now(),score,total:n});S.exams=S.exams.slice(-10);
    let g=score*8;if(p>=.8)g+=50;if(p>=.95)g+=100;run.xp+=g;award(g);run.newBest=p>prevBest&&S.exams.length>1;checkClusters()}
  else if(p===1&&n>=5){run.xp+=25;award(25)}
  save();checkBadges();go('results');
}
VIEWS.results=function(){
  const n=run.items.length,p=Math.round(100*run.score/n),stars=p>=90?3:p>=70?2:p>=50?1:0,li=levelInfo(S.xp);
  const miss=run.items.filter(it=>!it.ok);
  const msg=p===100?'Perfect run.':p>=95?'Test-ready.':p>=80?'Strong. Fix the misses below and you are there.':p>=60?'Getting there. The misses show where to focus.':'Good start. Every miss below is something you can fix tonight.';
  const list=miss.map(it=>`<div class="card"><div class="small muted">${qCluster(it.q).id} · Q${it.q.t.join(', ')}${it.sel===null?' · unanswered':''}</div>
    <div style="font-weight:600;margin:4px 0 8px">${esc(it.q.q)}</div>
    ${it.sel!==null?`<div class="small" style="color:var(--bad)">Your answer: ${esc(it.q.o[it.ord[it.sel]])}</div>`:''}
    <div class="small" style="color:var(--ok);font-weight:700">Correct: ${esc(it.q.o[0])}</div>
    <div class="small muted" style="margin-top:6px">${esc(it.q.e)}</div></div>`).join('');
  return `<div class="hdr center"><p style="margin:0 0 4px">${esc(run.title)}${run.newBest?' · new best':''}</p><div class="big" style="color:var(--amber)"><span id="cnt" data-to="${run.score}">0</span><span style="font-size:28px;color:#b9c7e3">/${n}</span></div>
   <div class="stars">${[0,1,2].map(i=>`<span style="display:inline-block">${STAR.replace('<svg','<svg class="'+(i<stars?'on':'')+'" style="animation-delay:'+(0.5+i*0.25)+'s"')}</span>`).join('')}</div>
   <p style="font-size:17px;margin:0">${p}% correct. ${msg}</p></div>
  <div class="pad"><div class="card"><div class="rstats"><div><b>+${run.xp}</b><span>XP earned</span></div><div><b>${run.mode==='exam'?run.score:run.best}</b><span>${run.mode==='exam'?'correct':'best combo'}</span></div><div><b>Lv ${li.lv}</b><span>${li.title}</span></div></div>
   <div class="xpbar" style="margin-top:12px;background:var(--line)"><i style="width:${li.frac}%"></i></div><div class="small muted" style="margin-top:5px">${li.have} / ${li.need} XP to level ${li.lv+1}</div></div>
  <div class="stack">
  ${miss.length?`<button class="btn amber" data-act="retrymiss">Retry the ${miss.length} I missed</button>`:'<div class="card center"><b>Every question right.</b><div class="muted small">Keep going until every topic is marked confident.</div></div>'}
  <button class="btn ghost" data-act="home">Back to home</button></div>
  ${miss.length?'<h2>What you missed</h2>'+list:''}</div>`;
};
AFTER.results=function(){
  const el=$('#cnt');if(!el)return;const to=+el.dataset.to,t0=performance.now(),dur=Math.min(1200,300+to*25);
  (function step(now){const k=Math.min(1,(now-t0)/dur);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)})(t0);
  const p=100*run.score/run.items.length;
  if(p>=90){setTimeout(()=>confetti(p===100?170:120,1.2),500);sfx('level')}else if(p>=70)sfx('badge');else sfx('right');
};

/* ================= COVERAGE ================= */
let covFilter='all',covOpen=null;
VIEWS.cov=function(){
  const cnt={conf:0,rev:0,new:0};ALLN.forEach(n=>cnt[status(n)]++);
  const covered=ALLN.filter(n=>mcqForTopic(n).length&&cardsForTopic(n).length).length;
  const chips=[['all','All 82'],['new','Not yet ('+cnt.new+')'],['rev','Needs review ('+cnt.rev+')'],['conf','Confident ('+cnt.conf+')']]
    .map(([k,l])=>`<button class="chip ${covFilter===k?'on':''}" data-filter="${k}">${l}</button>`).join('');
  let html=`<div class="hdr"><h1>Coverage checklist</h1><p>Every question on the review sheet. Nothing is confident until you mark it.</p></div><div class="pad">
   <div class="card small"><b>${covered}/82</b> review questions have both quiz questions and flashcards in this app.</div><div class="chips">${chips}</div>`;
  CLUSTERS.forEach(c=>{
    const ns=ALLN.filter(n=>n>=c.from&&n<=c.to&&(covFilter==='all'||status(n)===covFilter));
    if(!ns.length)return;
    const done=ALLN.filter(n=>n>=c.from&&n<=c.to&&status(n)==='conf').length;
    html+=`<div class="ctitle"><span class="badge">${c.id}</span><span>${esc(c.name)}</span><small>${done}/${c.to-c.from+1}</small></div>`;
    ns.forEach(n=>{html+=covRow(n)});
  });
  if(covFilter!=='all'&&!html.includes('qrow'))html+='<div class="card center muted">No topics here yet.</div>';
  return html+'</div>';
};
function covRow(n){
  const st=status(n),open=covOpen===n;
  let body='';
  if(open){
    const mq=mcqForTopic(n),cd=cardsForTopic(n);
    let c=0,w=0;mq.forEach(q=>{const s=S.q[q.id];if(s){c+=s.correct;w+=s.wrong}});
    body=`<div class="qbody"><div class="full">${esc(SRC[n-1])}</div>
    ${CHECK_NOTES[n]?`<div class="note">${esc(CHECK_NOTES[n])}</div>`:''}
    <div class="small muted">${mq.length} quiz question${mq.length!==1?'s':''} · ${cd.length} flashcard${cd.length!==1?'s':''} · ${c+w?pct(c,c+w)+'% correct on this topic':'not quizzed yet'}</div>
    <div class="seg"><button class="n ${st==='new'?'on':''}" data-set="${n}:new">Not yet</button><button class="r ${st==='rev'?'on':''}" data-set="${n}:rev">Needs review</button><button class="c ${st==='conf'?'on':''}" data-set="${n}:conf">Confident</button></div>
    <div class="btns"><button class="btn small" data-act="topicquiz" data-id="${n}">Quiz me</button><button class="btn small ghost" data-act="topiccards" data-id="${n}">Flashcards</button></div>
    <div class="small muted" style="margin:12px 0 6px">My notes for this topic</div>
    <textarea data-note="${n}" placeholder="Write your class's answer, examples, or a memory trick.">${esc(S.notes[n]||'')}</textarea></div>`;
  }
  return `<div class="qrow"><button class="qhead" data-open="${n}"><span class="badge">${n}</span><span class="t">${esc(SRC[n-1].split('\n')[0])}</span><span class="dot ${st}" aria-label="${st}"></span></button>${body}</div>`;
}

VIEWS.weak=function(){
  const ms=MCQ.filter(isMissed);
  const unseen=MCQ.filter(q=>!S.q[q.id]||!S.q[q.id].seen).length;
  const byCl=CLUSTERS.map(c=>({c,s:clusterStats(c)})).filter(x=>x.s.acc!==null).sort((a,b)=>a.s.acc-b.s.acc);
  const list=ms.slice(0,40).map(q=>{const s=S.q[q.id];return `<div class="card"><div class="small muted">${qCluster(q).id} · Q${q.t.join(', ')} · missed ${s.wrong}×</div><div style="font-weight:600;margin:4px 0">${esc(q.q)}</div><div class="small" style="color:var(--ok);font-weight:700">${esc(q.o[0])}</div></div>`}).join('');
  return `<div class="hdr"><h1>Weak spots</h1><p>A question stays here until you get it right twice in a row.</p></div><div class="pad">
  <div class="stack"><button class="btn amber" data-act="misses" ${ms.length?'':'disabled'}>Review ${ms.length} missed question${ms.length===1?'':'s'}</button>
  <button class="btn ghost" data-act="unseen" ${unseen?'':'disabled'}>Quiz me on ${unseen} unseen question${unseen===1?'':'s'}</button></div>
  ${byCl.length?'<h2>Clusters, weakest first</h2>'+byCl.map(x=>`<button class="row-item" data-act="cluster" data-id="${x.c.id}"><span class="badge">${x.c.id}</span><span class="grow"><b>${esc(x.c.name)}</b><span class="small muted">${x.s.acc}% accuracy · ${x.s.mastered}/${x.s.total} mastered</span></span></button>`).join(''):'<div class="card muted mt">Take a quiz first and your weak clusters will show up here.</div>'}
  ${ms.length?'<h2>Your misses</h2>'+list+(ms.length>40?'<div class="muted small center">Showing 40 of '+ms.length+'</div>':''):''}</div>`;
};

/* ================= events ================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go2]');if(g){e.preventDefault();go(g.dataset.go2);return}
  const f=e.target.closest('[data-filter]');if(f){covFilter=f.dataset.filter;render();return}
  const o=e.target.closest('[data-open]');if(o){const n=+o.dataset.open;covOpen=covOpen===n?null:n;render();return}
  const st=e.target.closest('[data-set]');if(st){const [n,v]=st.dataset.set.split(':');if(v==='new')delete S.cov[n];else S.cov[n]=v;save();
    if(v==='conf'&&!S.confXP[n]){S.confXP[n]=1;award(20);sfx('right');confetti(30,.6);render();floatXP('+20 XP',st);checkBadges();return}
    render();return}
  const op=e.target.closest('[data-opt]');if(op&&run&&route.name==='run'){pick(+op.dataset.opt);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  act(a.dataset.act,a.dataset.id);
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.note){const n=t.dataset.note;if(t.value.trim())S.notes[n]=t.value;else delete S.notes[n];save()}});
function pick(k){
  const it=run.items[run.i];
  if(run.mode==='exam'){it.sel=k;sfx('tap');render();return}
  if(it.done)return;
  const ok=it.ord[k]===0;
  it.sel=k;it.done=true;it.ok=ok;record(it.q.id,ok);activity(1);
  if(ok){
    run.combo++;run.best=Math.max(run.best,run.combo);S.bestCombo=Math.max(S.bestCombo||0,run.combo);
    const gain=10+2*(Math.min(run.combo,8)-1);run.xp+=gain;award(gain);
    sfx(run.combo>=3?'combo':'right');if(navigator.vibrate)navigator.vibrate(12);
    render();floatXP('+'+gain,document.querySelector('[data-opt="'+k+'"]'));
    if(run.combo%5===0)confetti(60);
  }else{run.combo=0;sfx('wrong');if(navigator.vibrate)navigator.vibrate([30,40,30]);render()}
  checkClusters();checkBadges();
}
function act(name,id){
  switch(name){
    case 'tip':S.tipDismissed=true;save();render();break;
    case 'sound':S.sound=!S.sound;save();sfx('tap');render();break;
    case 'exam':startRun('exam',buildExam(),'Full exam simulation');break;
    case 'sweep':startRun('practice',buildSweep(),'Coverage sweep');break;
    case 'smart':startRun('practice',buildSmart(20),'Smart 20');break;
    case 'misses':startRun('practice',shuffle(MCQ.filter(isMissed)),'Missed questions');break;
    case 'unseen':startRun('practice',shuffle(MCQ.filter(q=>!S.q[q.id]||!S.q[q.id].seen)).slice(0,30),'Unseen questions');break;
    case 'cluster':{const c=CLUSTERS.find(x=>x.id===id);startRun('practice',shuffle(MCQ.filter(q=>qCluster(q).id===id)),c.id+'. '+c.name);break}
    case 'topicquiz':startRun('practice',shuffle(mcqForTopic(+id)),'Topic '+id);break;
    case 'topiccards':startDeck(cardsForTopic(+id),'Topic '+id);break;
    case 'next':run.i++;render();window.scrollTo(0,0);break;
    case 'prev':run.i--;render();window.scrollTo(0,0);break;
    case 'finish':
      if(run.mode==='exam'){const un=run.items.filter(i=>i.sel===null).length;if(un&&!confirm(un+' question'+(un>1?'s are':' is')+' unanswered. Finish anyway?'))return}
      finishRun();break;
    case 'exit':if(confirm('Leave this session?')){run=null;deck=null;go('home')}break;
    case 'home':go('home');break;
    case 'retrymiss':{const qs=run.items.filter(i=>!i.ok).map(i=>i.q);startRun('practice',shuffle(qs),'Retry missed');break}
    case 'deckall':startDeck(CARDS,'All cards');break;
    case 'deckunknown':startDeck(CARDS.filter(c=>!(S.f[c.id]&&S.f[c.id].ok)),'Cards not yet known');break;
    case 'deckcluster':{const c=CLUSTERS.find(x=>x.id===id);startDeck(CARDS.filter(x=>clusterOf(x.t[0]).id===id),c.id+'. '+c.name);break}
    case 'flip':deck.flip=!deck.flip;render();break;
    case 'cardyes':case 'cardno':{
      const c=deck.cards[deck.i],ok=name==='cardyes';
      S.f[c.id]={ok:ok,seen:((S.f[c.id]||{}).seen||0)+1,last:Date.now()};save();
      if(ok){deck.got++;award(4);floatXP('+4');sfx('right')}else{deck.again.push(c);award(1);sfx('tap')}activity(1);
      deck.i++;deck.flip=false;render();window.scrollTo(0,0);if(deck.i>=deck.cards.length&&deck.got===deck.cards.length&&deck.cards.length>=5){award(20);confetti(130);sfx('level')}checkBadges();break}
    case 'deckagain':{const c=deck.again;startDeck(c,'Repeat: missed cards');break}
    case 'copy':{const t=$('#exp');t.select();t.setSelectionRange(0,999999);try{navigator.clipboard.writeText(t.value)}catch(x){document.execCommand('copy')}alert('Copied.');break}
    case 'download':{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='biotech-progress.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
    case 'import':{
      try{const d=JSON.parse($('#imp').value.trim());if(!d||d.v!==1||typeof d.q!=='object')throw 0;
        if(!confirm('Replace current progress with this import?'))return;
        S=Object.assign(blank(),d);save();alert('Imported.');go('home')}
      catch(x){alert('That does not look like an export from this app. Paste the full text and try again.')}break}
    case 'reset':if(confirm('Erase ALL progress, marks, and notes on this device?')&&confirm('This cannot be undone. Erase everything?')){S=blank();save();go('home')}break;
  }
}

/* ================= update check (when hosted and online) ================= */
(function(){
  try{
    if(!/^https?:/.test(location.protocol)||!navigator.onLine)return;
    fetch(location.href.split('#')[0].split('?')[0]+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{
      const m=t.match(/const APP_VERSION='([^']+)'/);
      if(m&&m[1]!==APP_VERSION&&!sessionStorage.getItem('reloadedFor'+m[1])){sessionStorage.setItem('reloadedFor'+m[1],'1');location.reload()}
    }).catch(()=>{});
  }catch(e){}
})();

render();
</script>
